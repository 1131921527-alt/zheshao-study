<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>泽少学习台 · 融合学习</title>
<style>
:root{
  --bg:#0a0e1a; --bg2:#0f1630; --bg3:#131c3a;
  --panel:rgba(255,255,255,.05); --panel2:rgba(255,255,255,.08);
  --line:rgba(120,160,255,.16); --line2:rgba(120,160,255,.30);
  --cyan:#38e1ff; --violet:#a07bff; --gold:#ffce5a; --green:#46e6a0; --red:#ff6b81;
  --txt:#e8edff; --mut:#8a96c0; --mut2:#5d6890;
  --r:18px; --r2:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--txt); background:#06090F; line-height:1.5; min-height:100vh;
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px;min-height:100vh}
@media(min-width:600px){
  body{background:#06090F}
  .wrap{max-width:540px;margin:16px auto;background:var(--bg);border-radius:20px;box-shadow:0 8px 60px rgba(0,0,0,.5);border-left:1px solid var(--line);border-right:1px solid var(--line);overflow:hidden;min-height:calc(100vh - 32px)}
}
a{color:inherit;text-decoration:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line2);background:var(--panel2);color:var(--txt);
  border-radius:var(--r2);padding:14px 16px;font-size:15px;font-weight:700;cursor:pointer;
  min-height:48px;transition:.18s;user-select:none;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--violet));border:none;color:#06121f;box-shadow:0 8px 22px rgba(56,225,255,.28)}
.btn.red{background:linear-gradient(135deg,#ff8a9b,#ff6b81);border:none;color:#fff}
.btn.green{background:linear-gradient(135deg,#5fe6b0,var(--green));border:none;color:#06231a}
.btn.gold{background:linear-gradient(135deg,var(--gold),#ff9d4d);color:#241500;border:none}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

.card-ui{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}

/* 顶部 */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.topbar h1{font-size:19px;font-weight:800;margin:0;letter-spacing:.5px}
.topbar .sub{font-size:12px;color:var(--mut)}
.spacer{flex:1}
.xpchip{background:linear-gradient(135deg,var(--gold),#ff9d4d);color:#241500;font-weight:800;padding:6px 12px;border-radius:20px;font-size:13px}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:14px;cursor:pointer;margin-bottom:10px}
.back-link:active{color:var(--cyan)}

/* 牌组 */
.section-title{font-size:13px;color:var(--mut);letter-spacing:2px;margin:6px 4px 12px;text-transform:uppercase}
.deck{
  position:relative;overflow:hidden;border-radius:var(--r);padding:18px;margin-bottom:14px;cursor:pointer;
  border:1px solid var(--line2); transition:.18s;
}
.deck:active{transform:scale(.99)}
.deck .row{display:flex;align-items:center;gap:14px}
.deck .emoji-box{width:56px;height:56px;flex:0 0 56px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#06121f;font-size:26px}
.deck .info{flex:1;min-width:0}
.deck .dn{font-size:17px;font-weight:800}
.deck .dd{font-size:12.5px;color:var(--mut);margin-top:3px}
.deck .prog{height:8px;border-radius:20px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:12px;border:1px solid var(--line)}
.deck .prog>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--cyan),var(--violet));width:0}
.deck .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:8px}
.deck .go{font-size:13px;font-weight:800;color:var(--cyan)}

/* 学习区通用 */
.progress-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.progress-top .bar{flex:1;height:10px;border-radius:20px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid var(--line)}
.progress-top .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .3s}
.progress-top .cnt{font-size:13px;color:var(--mut);white-space:nowrap}

.learn-card{
  background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line2);border-radius:var(--r);
  padding:22px;min-height:360px;display:flex;flex-direction:column;position:relative;
}
.learn-card .ft{font-size:12px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.learn-card .tag-pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.06);color:var(--mut);border:1px solid var(--line);margin-bottom:10px;width:fit-content}
.learn-card .media{
  width:100%;height:180px;border-radius:var(--r2);margin:8px 0 16px;
  display:flex;align-items:center;justify-content:center;font-size:80px;
  background:linear-gradient(135deg,rgba(56,225,255,.10),rgba(160,123,255,.10));border:1px solid var(--line);
  overflow:hidden;
}
.learn-card .media img{width:100%;height:100%;object-fit:cover}
.learn-card .big{font-size:34px;font-weight:900;letter-spacing:.5px;word-break:break-word;line-height:1.2}
.learn-card .ipa{font-size:16px;color:var(--cyan);margin-top:6px;display:flex;align-items:center;gap:8px}
.learn-card .pos{font-size:15px;color:var(--violet);margin-top:8px;font-weight:700}
.learn-card .ex-en{font-size:15px;color:var(--txt);margin-top:14px;line-height:1.6}
.learn-card .ex-cn{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.5}
.learn-card .summary{font-size:15px;color:#c9d1d9;line-height:1.7;margin-top:8px}
.learn-card .source{font-size:12px;color:var(--mut);margin-top:14px}
.speaker{
  width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line2);cursor:pointer;vertical-align:middle;
}
.speaker:active{transform:scale(.93)}

.actions{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:0}
.actions .btn.half{flex:0 0 calc(50% - 6px)}

/* 拼写区 */
.spell-box{margin-top:16px;padding:16px;border-radius:var(--r2);background:rgba(0,0,0,.18);border:1px solid var(--line)}
.spell-box .lab{font-size:13px;color:var(--mut);margin-bottom:8px}
.spell-box input{
  width:100%;padding:12px 14px;border-radius:var(--r2);border:1px solid var(--line2);background:rgba(255,255,255,.05);
  color:var(--txt);font-size:16px;outline:none;margin-bottom:10px;
}
.spell-box input:focus{border-color:var(--cyan)}
.spell-box .res{font-size:14px;font-weight:700;margin-top:8px;min-height:20px}
.spell-box .res.ok{color:var(--green)}
.spell-box .res.err{color:var(--red)}

.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:90;background:rgba(20,28,58,.96);border:1px solid var(--line2);color:var(--txt);padding:11px 18px;border-radius:30px;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1;top:26px}

.center-note{text-align:center;padding:40px 0;color:var(--mut)}
.loader{width:36px;height:36px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--cyan);border-radius:50%;animation:spin 1s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}

.done-card{text-align:center;padding:30px 20px}
.done-card .big{font-size:48px;font-weight:900;color:var(--cyan);margin-bottom:10px}
.done-card .sub{color:var(--mut);margin-bottom:20px}
</style>
</head>
<body>
<div class="wrap">

  <!-- 首页 -->
  <div id="view-home">
    <div class="topbar">
      <div>
        <h1>泽少学习台</h1>
        <div class="sub">融合学习 · 点开即学</div>
      </div>
      <div class="spacer"></div>
      <div class="xpchip" id="xpChip">XP 0</div>
    </div>

    <div class="section-title">选择板块 · LIBRARY</div>
    <div id="deckList"></div>

    <div class="card-ui" style="margin-top:14px">
      <div style="font-size:14px;font-weight:800;margin-bottom:8px">数据备份</div>
      <div style="color:var(--mut);font-size:13px;margin-bottom:10px">进度存在本机浏览器，建议定期导出备份。</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn primary" id="expBtn">导出 JSON</button>
        <button class="btn" id="impBtn">导入恢复</button>
        <input type="file" id="impFile" accept="application/json" style="display:none">
      </div>
    </div>
    <div class="center-note" style="color:var(--mut2);font-size:12px">
      泽少学习台 · 英语单词 / AI动态 / 知识卡片<br>本地进度 · 离线可用
    </div>
  </div>

  <!-- 英语单词学习 -->
  <div id="view-word" style="display:none">
    <div class="back-link" onclick="goHome()">← 返回学习台</div>
    <div class="progress-top">
      <div class="bar"><i id="progWord" style="width:0"></i></div>
      <div class="cnt" id="cntWord">1 / 20</div>
    </div>
    <div class="learn-card" id="wordCard">
      <div class="ft">英语 · 雅思词汇</div>
      <div class="media" id="wordMedia">📚</div>
      <div class="big" id="wordText">word</div>
      <div class="ipa" id="wordIpa"><span>/ipa/</span><span class="speaker" id="wordSpeak">🔊</span></div>
      <div class="pos" id="wordPos">pos</div>
      <div class="ex-en" id="wordEn">英文例句</div>
      <div class="ex-cn" id="wordCn">中文翻译</div>
      <div class="spell-box">
        <div class="lab">拼写练习 · 输入上面的单词</div>
        <input type="text" id="spellInput" placeholder="在这里输入单词" autocomplete="off" autocapitalize="off">
        <div style="display:flex;gap:10px">
          <button class="btn primary" id="spellCheck">检查</button>
          <button class="btn ghost" id="spellHint">提示</button>
        </div>
        <div class="res" id="spellRes"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="wordPrev">← 上一个</button>
      <button class="btn green" id="wordNext">下一个 →</button>
    </div>
  </div>

  <!-- AI 动态阅读 -->
  <div id="view-news" style="display:none">
    <div class="back-link" onclick="goHome()">← 返回学习台</div>
    <div class="progress-top">
      <div class="bar"><i id="progNews" style="width:0"></i></div>
      <div class="cnt" id="cntNews">1 / 5</div>
    </div>
    <div class="learn-card" id="newsCard">
      <div class="ft">AI 动态</div>
      <div class="tag-pill" id="newsTag">OpenAI</div>
      <div class="big" id="newsTitle" style="font-size:22px;margin-top:4px">标题</div>
      <div class="source" id="newsDate">2026-08-20</div>
      <div class="summary" id="newsSummary">摘要</div>
      <div class="summary" id="newsImpact" style="color:var(--cyan)">📌 影响</div>
      <div class="summary" id="newsUses" style="color:var(--green)">💡 应用</div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="newsPrev">← 上一篇</button>
      <button class="btn green" id="newsNext">下一篇 →</button>
    </div>
  </div>

  <!-- 知识卡片阅读 -->
  <div id="view-article" style="display:none">
    <div class="back-link" onclick="goHome()">← 返回学习台</div>
    <div class="progress-top">
      <div class="bar"><i id="progArt" style="width:0"></i></div>
      <div class="cnt" id="cntArt">1 / 5</div>
    </div>
    <div class="learn-card" id="artCard">
      <div class="ft">知识卡片</div>
      <div class="tag-pill" id="artCat">分类</div>
      <div class="big" id="artTitle" style="font-size:22px;margin-top:4px">标题</div>
      <div class="summary" id="artSummary">摘要</div>
      <div class="source"><a id="artLink" href="#" target="_blank" style="color:var(--cyan);text-decoration:underline">→ 阅读全文</a></div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="artPrev">← 上一篇</button>
      <button class="btn green" id="artNext">下一篇 →</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>
<audio id="audio"></audio>

<script>
/* ============ 图标工具 ============ */
function svg(p){return '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
var ICONS={
  word:'📖',
  ai:'🤖',
  know:'🧠',
  speak:'🔊',
  back:'←'
};

/* ============ 牌组配置 ============ */
var DECKS=[
  {key:'en', name:'英语 · 雅思词汇', desc:'1170 词 · 发音+图片+释义+拼写', type:'word', src:'ielts/ielts_bank.json', color:'linear-gradient(135deg,#1f6feb,#a371f7)', icon:'📖', batch:20},
  {key:'ai', name:'AI 动态', desc:'38 条行业新闻与产品动态', type:'news', src:'assets/ai_cards.json', color:'linear-gradient(135deg,#ff8a5c,#ff5d8f)', icon:'🤖', batch:5},
  {key:'kn', name:'知识卡片', desc:'35 篇 AI/历史/习惯/地理', type:'know', src:'assets/knowledge_cards.json', color:'linear-gradient(135deg,#46e6a0,#2fc1c1)', icon:'🧠', batch:5}
];

/* ============ 存储（与 index.html 共享前缀 wb_zs_） ============ */
var ZS_PREFIX='wb_zs_';
var STUDY_KEY='study';
var XP_KEY='xp';
function zg(k,def){try{var v=localStorage.getItem(ZS_PREFIX+k);return v===null?def:JSON.parse(v);}catch(e){return def;}}
function zs(k,v){try{localStorage.setItem(ZS_PREFIX+k,JSON.stringify(v));}catch(e){toast('存储失败，空间可能已满');}}

var G={
  xp:zg(XP_KEY,0),
  study:zg(STUDY_KEY,{words:[],news:[],articles:[],spellToday:0,wordToday:0,newsToday:0,artToday:0,lastDate:''})
};
function saveStudy(){zs(STUDY_KEY,G.study);}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function resetDailyIfNeeded(){var t=todayStr(); if(G.study.lastDate!==t){G.study.lastDate=t;G.study.spellToday=0;G.study.wordToday=0;G.study.newsToday=0;G.study.artToday=0;saveStudy();}}

/* ============ 数据缓存 ============ */
var cache={};
function loadDeck(deck,cb){
  if(cache[deck.key]){cb(cache[deck.key]);return;}
  fetch(deck.src).then(function(r){return r.json();}).then(function(data){
    var items=(deck.type==='word')?data:(data.cards||[]);
    cache[deck.key]=items; cb(items);
  }).catch(function(){ toast('数据加载失败，请通过 http 访问'); });
}

/* ============ emoji 配图 ============ */
function wordEmoji(word, cn){
  var s=(word+' '+cn).toLowerCase();
  var map=[
    [/abundant|丰富|大量/, '🌾'],[/deteriorate|恶化|变坏/, '📉'],[/inevitable|不可避免/, '⏳'],
    [/controversial|争议/, '🗣️'],[/phenomenon|现象/, '🔭'],[/sustainable|可持续/, '🌱'],
    [/fluctuate|波动/, '📊'],[/predominant|主要/, '👑'],[/expedite|加速/, '🚀'],
    [/ambiguous|模糊/, '🌫️'],[/comprehensive|全面/, '📚'],[/demonstrate|证明/, '🧪'],
    [/exaggerate|夸张/, '🎭'],[/facilitate|促进/, '⚡'],[/hierarchy|等级/, '🏢'],
    [/implement|实施/, '🛠️'],[/justify|证明合理/, '⚖️'],[/legitimate|合法/, '✅'],
    [/manipulate|操纵/, '🎮'],[/notion|概念/, '💡'],[/obstacle|障碍/, '🚧'],
    [/perceive|感知/, '👁️'],[/questionnaire|问卷/, '📋'],[/relevant|相关/, '🔗'],
    [/subsequent|随后/, '➡️'],[/tangible|有形/, '✋'],[/underlying|潜在/, '🏔️'],
    [/vulnerable|脆弱/, '🥀'],[/widespread|广泛/, '🌍'],[/yield|产量|屈服/, '🌽'],
    [/prosper|繁荣/, '🌞'],[/decline|下降/, '📉'],[/enhance|提高/, '⬆️'],
    [/fundamental|根本/, '📜'],[/generate|产生/, '⚙️'],[/hypothesis|假设/, '❓'],
    [/illustrate|说明/, '🎨'],[/justify| justify/, '⚖️'],[/monetary|货币/, '💰'],
    [/nuclear|核/, '⚛️'],[/optimal|最佳/, '⭐'],[/paradox|悖论/, '🌀'],
    [/qualitative|定性/, '📖'],[/random|随机/, '🎲'],[/scrutinize|仔细检查/, '🔍'],
    [/tentative|试探/, '🤔'],[/ultimate|最终/, '🏁'],[/valid|有效/, '✔️'],
    [/warrant|保证/, '🛡️'],[/allocate|分配/, '📤'],[/bulk| bulk/, '📦'],
    [/commodity|商品/, '🛒'],[/discrete|离散/, '🧩'],[/erode|侵蚀/, '🌊'],
    [/flexible|灵活/, '🤸'],[/genuine| genuine/, '💎'],[/hostile|敌对/, '⚔️'],
    [/inhibit|抑制/, '🛑'],[/juvenile|青少年/, '👶'],[/lateral|侧面/, '↔️'],
    [/mature|成熟/, '🍷'],[/neutral|中性/, '⚪'],[/orient| orient/, '🧭'],
    [/passive|被动/, '😶'],[/radical|激进/, '🔥'],[/static|静态/, '🪨'],
    [/transparent|透明/, '🔎'],[/unanimous|一致/, '🙌'],[/vertical|垂直/, '⬆️'],
    [/weary|疲倦/, '😴'],[/zealous|热情/, '🔥'],[/abandon|放弃/, '🚪'],
    [/abstract|抽象/, '🎭'],[/academy|学院/, '🎓'],[/access|访问/, '🚪'],
    [/accommodate|容纳/, '🏠'],[/accomplish|完成/, '🏆'],[/accurate|准确/, '🎯'],
    [/achieve| achieve/, '🥇'],[/acknowledge|承认/, '🙋'],[/acquire|获得/, '🎁'],
    [/adapt|适应/, '🦎'],[/adequate|足够/, '✅'],[/adjust|调整/, '🔧'],
    [/administrate|管理/, '🏛️'],[/advocate|提倡/, '📣'],[/aesthetic|美学/, '🖼️'],
    [/affirm|肯定/, '👍'],[/aggravate|加重/, '➕'],[/alleviate|缓解/, '💊'],
    [/amend|修改/, '✏️'],[/analogy|类比/, '🔗'],[/analyze|分析/, '📊'],
    [/ancestor|祖先/, '👴'],[/anniversary|周年/, '🎂'],[/anticipate|预期/, '🔮'],
    [/anxiety|焦虑/, '😰'],[/apparent|明显/, '👀'],[/appendix|附录/, '📎'],
    [/applaud|鼓掌/, '👏'],[/appoint|任命/, '👔'],[/approach|方法/, '🛤️'],
    [/appropriate|适当/, '👌'],[/arbitrary|任意/, '🎲'],[/arithmetic|算术/, '🔢'],
    [/arouse|激起/, '⚡'],[/articulate|善于表达/, '🗣️'],[/artificial|人工/, '🤖'],
    [/ascend|上升/, '⬆️'],[/aspiration|志向/, '🌟'],[/assemble|组装/, '🧩'],
    [/assess|评估/, '📝'],[/assign|分配/, '📋'],[/assist|帮助/, '🤝'],
    [/assume|假设/, '🤔'],[/assure|保证/, '✋'],[/astonish|惊讶/, '😲'],
    [/attach| attach/, '📎'],[/attain|达到/, '🎯'],[/attribute|属性/, '🏷️'],
    [/auction|拍卖/, '🔨'],[/audience|观众/, '👥'],[/authority|权威/, '👑'],
    [/automatic|自动/, '⚙️'],[/available|可用/, '✅'],[/aware|意识/, '🧠']
  ];
  for(var i=0;i<map.length;i++){ if(map[i][0].test(s)) return map[i][1]; }
  return '📚';
}

/* ============ 首页 ============ */
function goHome(){renderHome();}
function renderHome(){
  resetDailyIfNeeded();
  document.getElementById('view-home').style.display='';
  document.getElementById('view-word').style.display='none';
  document.getElementById('view-news').style.display='none';
  document.getElementById('view-article').style.display='none';
  document.getElementById('xpChip').textContent='XP '+G.xp;
  var box=document.getElementById('deckList'); var h='';
  DECKS.forEach(function(d){
    loadDeck(d,function(items){
      var p=deckProgress(d.key, items.length);
      var prog=document.getElementById('deckProg_'+d.key);
      if(prog){ prog.style.width=p.pct+'%'; }
      var meta=document.getElementById('deckMeta_'+d.key);
      if(meta){ meta.textContent=p.text; }
    });
    h+='<div class="deck" data-key="'+d.key+'" style="background:linear-gradient(135deg,'+d.color.replace('135deg','160deg')+',rgba(255,255,255,.02))">'
      +'<div class="row">'
      +'<div class="emoji-box" style="background:'+d.color+'">'+d.icon+'</div>'
      +'<div class="info"><div class="dn">'+d.name+'</div><div class="dd">'+d.desc+'</div></div>'
      +'</div>'
      +'<div class="prog"><i id="deckProg_'+d.key+'"></i></div>'
      +'<div class="meta"><span id="deckMeta_'+d.key+'">加载中…</span><span class="go">开始学习 →</span></div>'
      +'</div>';
  });
  box.innerHTML=h;
  box.querySelectorAll('.deck').forEach(function(el){
    el.addEventListener('click',function(){ startDeck(el.getAttribute('data-key')); });
  });
}
function deckProgress(key, total){
  var d=G.study;
  var known=0;
  if(key==='en') known=d.words.length;
  else if(key==='ai') known=d.news.length;
  else if(key==='kn') known=d.articles.length;
  var pct=total?Math.round(known/total*100):0;
  return {known:known,total:total,pct:pct,text:known+' / '+total+' 已学 ('+pct+'%)'};
}

/* ============ 学习会话 ============ */
var cur=null; // {deck, items, idx, type}
function startDeck(key){
  var deck=DECKS.filter(function(d){return d.key===key;})[0];
  loadDeck(deck,function(items){
    // 优先未学过的，再放已学过但未完成的
    var seen=getSeen(key);
    var unseen=items.filter(function(it){return seen.indexOf(idOf(deck,it))<0;});
    var pool=unseen.concat(items.filter(function(it){return seen.indexOf(idOf(deck,it))>=0;}));
    var n=Math.min(deck.batch, pool.length);
    if(n===0){ toast('该板块已学完，去复习吧～'); return; }
    cur={deck:deck, items:pool.slice(0,n), idx:0, type:deck.type};
    document.getElementById('view-home').style.display='none';
    if(key==='en'){ document.getElementById('view-word').style.display=''; renderWord(); }
    else if(key==='ai'){ document.getElementById('view-news').style.display=''; renderNews(); }
    else { document.getElementById('view-article').style.display=''; renderArticle(); }
  });
}
function getSeen(key){
  if(key==='en') return G.study.words||[];
  if(key==='ai') return G.study.news||[];
  return G.study.articles||[];
}
function addSeen(key,id){
  if(key==='en'){
    if(G.study.words.indexOf(id)<0){ G.study.words.push(id); G.study.wordToday++; }
  }else if(key==='ai'){
    if(G.study.news.indexOf(id)<0){ G.study.news.push(id); G.study.newsToday++; }
  }else{
    if(G.study.articles.indexOf(id)<0){ G.study.articles.push(id); G.study.artToday++; }
  }
  saveStudy();
}
function idOf(deck,it){ return deck.type==='word'? it.word : (it.title||''); }
function updateProgress(id, idx, total){
  var pct=Math.round((idx+1)/total*100);
  document.getElementById(id).style.width=pct+'%';
  document.getElementById(id.replace('prog','cnt')).textContent=(idx+1)+' / '+total;
}

/* ============ 单词学习 ============ */
function renderWord(){
  var it=cur.items[cur.idx];
  document.getElementById('wordText').textContent=it.word;
  document.getElementById('wordIpa').innerHTML='<span>'+esc(it.ipa||'')+'</span><span class="speaker" id="wordSpeak">🔊</span>';
  document.getElementById('wordPos').textContent=it.pos||'';
  document.getElementById('wordEn').textContent=it.en||'';
  document.getElementById('wordCn').textContent=it.cn||'';
  document.getElementById('wordMedia').innerHTML=wordMedia(it);
  document.getElementById('spellInput').value='';
  document.getElementById('spellRes').textContent='';
  document.getElementById('spellRes').className='res';
  updateProgress('progWord', cur.idx, cur.items.length);
  document.getElementById('wordPrev').style.visibility=cur.idx>0?'visible':'hidden';
  document.getElementById('wordNext').textContent=cur.idx===cur.items.length-1?'完成学习 ✓':'下一个 →';
  var sp=document.getElementById('wordSpeak');
  if(sp){ sp.onclick=function(){ playWordAudio(cur.items[cur.idx].word); }; }
  if(new URLSearchParams(window.location.search).get('tab')==='spell'){
    setTimeout(function(){ var inp=document.getElementById('spellInput'); if(inp) inp.focus(); }, 100);
  }
}
function wordMedia(it){
  if(it.image){ return '<img src="'+esc(it.image)+'" alt="'+esc(it.word)+'">'; }
  return '<div style="font-size:80px">'+wordEmoji(it.word,it.cn||'')+'</div>';
}
function playWordAudio(w){
  var a=document.getElementById('audio');
  a.src='ielts/audio/'+encodeURIComponent(w)+'_us.mp3';
  a.play().catch(function(){ toast('暂无音频'); });
}
document.getElementById('wordSpeak').addEventListener('click',function(){ playWordAudio(cur.items[cur.idx].word); });
document.getElementById('wordText').addEventListener('click',function(){ playWordAudio(cur.items[cur.idx].word); });
document.getElementById('wordNext').addEventListener('click',function(){
  addSeen('en', idOf(cur.deck, cur.items[cur.idx]));
  if(cur.idx>=cur.items.length-1){ finishWord(); }
  else { cur.idx++; renderWord(); }
});
document.getElementById('wordPrev').addEventListener('click',function(){ if(cur.idx>0){cur.idx--;renderWord();} });

/* 拼写检查 */
document.getElementById('spellCheck').addEventListener('click',function(){
  var input=document.getElementById('spellInput').value.trim().toLowerCase();
  var ans=cur.items[cur.idx].word.toLowerCase();
  var res=document.getElementById('spellRes');
  if(input===ans){
    res.textContent='✓ 拼写正确！';
    res.className='res ok';
    if(G.study.spellToday<10){ G.study.spellToday++; saveStudy(); }
  }else{
    res.textContent='✗ 正确拼写：'+ans;
    res.className='res err';
  }
});
document.getElementById('spellHint').addEventListener('click',function(){
  var w=cur.items[cur.idx].word;
  document.getElementById('spellRes').textContent='提示：'+w.charAt(0)+'... ('+w.length+' 个字母)';
  document.getElementById('spellRes').className='res';
});
document.getElementById('spellInput').addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('spellCheck').click(); });
function finishWord(){
  toast('本轮单词学习完成！');
  renderHome();
}

/* ============ AI 动态阅读 ============ */
function renderNews(){
  var it=cur.items[cur.idx];
  document.getElementById('newsTag').textContent=it.tag||'AI';
  document.getElementById('newsTitle').textContent=it.title;
  document.getElementById('newsDate').textContent=it.date?('日期：'+it.date):'';
  document.getElementById('newsSummary').textContent=it.summary||'';
  document.getElementById('newsImpact').textContent=it.impact?'📌 影响：'+it.impact:'';
  document.getElementById('newsUses').textContent=it.uses?'💡 应用：'+it.uses:'';
  updateProgress('progNews', cur.idx, cur.items.length);
  document.getElementById('newsPrev').style.visibility=cur.idx>0?'visible':'hidden';
  document.getElementById('newsNext').textContent=cur.idx===cur.items.length-1?'完成阅读 ✓':'下一篇 →';
}
document.getElementById('newsNext').addEventListener('click',function(){
  addSeen('ai', idOf(cur.deck, cur.items[cur.idx]));
  if(cur.idx>=cur.items.length-1){ toast('AI 动态阅读完成！'); renderHome(); }
  else { cur.idx++; renderNews(); }
});
document.getElementById('newsPrev').addEventListener('click',function(){ if(cur.idx>0){cur.idx--;renderNews();} });

/* ============ 知识卡片阅读 ============ */
function renderArticle(){
  var it=cur.items[cur.idx];
  document.getElementById('artCat').textContent=it.cat||'知识';
  document.getElementById('artTitle').textContent=it.title;
  document.getElementById('artSummary').textContent=it.summary||'';
  var link=document.getElementById('artLink');
  if(it.href){ link.href=it.href; link.style.display=''; }
  else { link.style.display='none'; }
  updateProgress('progArt', cur.idx, cur.items.length);
  document.getElementById('artPrev').style.visibility=cur.idx>0?'visible':'hidden';
  document.getElementById('artNext').textContent=cur.idx===cur.items.length-1?'完成阅读 ✓':'下一篇 →';
}
document.getElementById('artNext').addEventListener('click',function(){
  addSeen('kn', idOf(cur.deck, cur.items[cur.idx]));
  if(cur.idx>=cur.items.length-1){ toast('知识卡片阅读完成！'); renderHome(); }
  else { cur.idx++; renderArticle(); }
});
document.getElementById('artPrev').addEventListener('click',function(){ if(cur.idx>0){cur.idx--;renderArticle();} });

/* ============ 备份 ============ */
function exportData(){
  var data={xp:G.xp,study:G.study,exportedAt:new Date().toISOString()};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zheshao-study-backup.json';a.click();
  toast('已导出备份');
}
function importData(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if('xp' in d) G.xp=d.xp;
      if('study' in d) G.study=d.study;
      zs(XP_KEY,G.xp); saveStudy();
      renderHome(); toast('导入成功');
    }catch(e){ toast('文件格式错误'); }
  };
  r.readAsText(file);
}
document.getElementById('expBtn').addEventListener('click',exportData);
document.getElementById('impBtn').addEventListener('click',function(){document.getElementById('impFile').click();});
document.getElementById('impFile').addEventListener('change',function(e){if(e.target.files[0])importData(e.target.files[0]);});

/* ============ 工具 ============ */
var toastTimer;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on');},1600);}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

/* ============ 启动 ============ */
function startFromUrl(){
  var params=new URLSearchParams(window.location.search);
  var deck=params.get('deck');
  if(!deck) return false;
  if(!DECKS.some(function(d){return d.key===deck;})) return false;
  setTimeout(function(){ startDeck(deck); }, 80);
  return true;
}
if(!startFromUrl()) renderHome();
</script>
