<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>泽少学习台 · 百词斩式学习</title>
<style>
:root{
  --bg:#0a0e1a; --bg2:#0f1630; --bg3:#131c3a;
  --panel:rgba(255,255,255,.05); --panel2:rgba(255,255,255,.08);
  --line:rgba(120,160,255,.16); --line2:rgba( 120,160,255,.30);
  --cyan:#38e1ff; --violet:#a07bff; --gold:#ffce5a; --green:#46e6a0; --red:#ff6b81;
  --txt:#e8edff; --mut:#8a96c0; --mut2:#5d6890;
  --r:18px; --r2:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--txt); background:var(--bg); line-height:1.5; min-height:100vh;
  background-image:
    radial-gradient(900px 500px at 12% -8%, rgba(56,225,255,.14), transparent 60%),
    radial-gradient(800px 520px at 92% 4%, rgba(160,123,255,.14), transparent , transparent 60%),
    radial-gradient(700px 600px at 50% 110%, rgba(70,230,160,.08), transparent 60%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 55%,var(--bg) 100%);
  background-attachment:fixed;
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px}
a{color:inherit;text-decoration:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line2);background:var(--panel2);color:var(--txt);
  border-radius:var(--r2);padding:14px 16px;font-size:15px;font-weight:700;cursor:pointer;
  min-height:48px;transition:.18s;user-select:none;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--violet));border:none;color:#06121f;box-shadow:0 8px 22px rgba(56,225,255,.28)}
.btn.red{background:linear-gradient(135deg,#ff8a9b,#ff6b81);border:none;color:#fff}
.btn.green{background:linear-gradient(135deg,#5fe6b0,#46e6a0);border:none;color:#06231a}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

.card-ui{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}

/* ===== 顶部 ===== */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.topbar h1{font-size:19px;font-weight:800;margin:0;letter-spacing:.5px}
.topbar .sub{font-size:12px;color:var(--mut)}
.spacer{flex:1}
.xpchip{background:linear-gradient(135deg,var(--gold),#ff9d4d);color:#241500;font-weight:800;padding:6px 12px;border-radius:20px;font-size:13px}

/* ===== 牌组 ===== */
.section-title{font-size:13px;color:var(--mut);letter-spacing:2px;margin:6px 4px 12px;text-transform:uppercase}
.deck{
  position:relative;overflow:hidden;border-radius:var(--r);padding:18px;margin-bottom:14px;cursor:pointer;
  border:1px solid var(--line2);
  transition:.18s;
}
.deck:active{transform:scale(.99)}
.deck .row{display:flex;align-items:center;gap:14px}
.deck .emoji-box{width:56px;height:56px;flex:0 0 56px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#06121f}
.deck .info{flex:1;min-width:0}
.deck .dn{font-size:17px;font-weight:800}
.deck .dd{font-size:12.5px;color:var(--mut);margin-top:3px}
.deck .prog{height:8px;border-radius:20px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:12px;border:1px solid var(--line)}
.deck .prog>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--cyan),var(--violet));width:0}
.deck .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:8px}
.deck .go{font-size:13px;font-weight:800;color:var(--cyan)}

/* ===== 学习区 ===== */
.progress-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.progress-top .bar{flex:1;height:10px;border-radius:20px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid var(--line)}
.progress-top .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .3s}
.progress-top .cnt{font-size:13px;color:var(--mut);white-space:nowrap}

.flip{position:relative;perspective:1400px;height:300px;margin-bottom:14px}
.card3d{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.card3d.flip-on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;border:1px solid var(--line2);
  background:linear-gradient(160deg,var(--panel2),var(--panel));padding:22px;display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg)}
.face .ft{font-size:12px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}
.face .big{font-size:40px;font-weight:900;margin-top:14px;letter-spacing:.5px;word-break:break-word}
.face .ipa{font-size:16px;color:var(--cyan);margin-top:6px}
.face .pos{font-size:15px;color:var(--violet);margin-top:8px}
.face .ex-en{font-size:15px;color:var(--txt);margin-top:14px;line-height:1.5}
.face .ex-cn{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.5}
.face .hint{margin-top:auto;font-size:12px;color:var(--mut2);text-align:center}
.speaker{position:absolute;right:16px;bottom:16px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line2);cursor:pointer}
.speaker:active{transform:scale(.93)}
.tag-pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.06);color:var(--mut);border:1px solid var(--line)}
.title-front{font-size:22px;font-weight:800;line-height:1.4;margin-top:10px}
.summary{font-size:15px;color:#c9d1d9;line-height:1.7;margin-top:12px;overflow:auto}
.source{font-size:12px;color:var(--mut);margin-top:12px}
.actions{display:flex;gap:12px;margin-top:4px}
.actions .btn{flex:1}

/* ===== 结果 ===== */
.result-box{text-align:center;padding:10px 0}
.result-box .big{font-size:46px;font-weight:900;color:var(--cyan)}
.result-box .sub{color:var(--mut);margin-top:6px}

.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:90;background:rgba(20,28,58,.96);border:1px solid var(--line2);color:var(--txt);padding:11px 18px;border-radius:30px;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1;top:26px}

.center-note{text-align:center;padding:40px 0;color:var(--mut)}
.loader{width:36px;height:36px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--cyan);border-radius:50%;animation:spin 1s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.nav-back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:14px;cursor:pointer;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
  <div id="view-home">
    <div class="topbar">
      <div>
        <h1>泽少学习台</h1>
        <div class="sub">百词斩式 · 随手刷，随时学</div>
      </div>
      <div class="spacer"></div>
      <div class="xpchip" id="xpChip">XP 0</div>
    </div>

    <div class="section-title">选择牌组 · DECKS</div>
    <div id="deckList"></div>

    <div class="card-ui" style="margin-top:14px">
      <div style="font-size:14px;font-weight:800;margin-bottom:8px">数据备份</div>
      <div class="small muted" style="color:var(--mut);font-size:13px;margin-bottom:10px">进度存在本机浏览器，建议定期导出备份。</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn primary" id="expBtn">导出 JSON</button>
        <button class="btn" id="impBtn">导入恢复</button>
        <input type="file" id="impFile" accept="application/json" style="display:none">
      </div>
    </div>
    <div class="center-note small" style="color:var(--mut2);font-size:12px">
      泽少学习台 · 英语单词 / AI动态 / 知识卡片<br>本地进度 · 离线可用
    </div>
  </div>

  <div id="view-learn" style="display:none">
    <div class="nav-back" id="backHome">← 返回牌组</div>
    <div class="progress-top">
      <div class="bar"><i id="progFill" style="width:0"></i></div>
      <div class="cnt" id="progCnt">0 / 0</div>
    </div>
    <div class="flip">
      <div class="card3d" id="card3d">
        <div class="face front" id="faceFront"></div>
        <div class="face back" id="faceBack"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn red" id="btnNo">不认识</button>
      <button class="btn green" id="btnYes">认识</button>
    </div>
  </div>

  <div id="view-result" style="display:none">
    <div class="nav-back" id="backHome2">← 返回牌组</div>
    <div class="card-ui result-box">
      <div class="big" id="resRate">0%</div>
      <div class="sub" id="resText">本轮学习完成</div>
      <div style="display:flex;gap:12px;margin-top:18px">
        <button class="btn primary" id="againBtn">再来一轮</button>
        <button class="btn ghost" id="homeBtn">回到首页</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<audio id="audio"></audio>

<script>
/* ============ 图标（内联 SVG） ============ */
function svg(p){return '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
var ICONS={
  word:svg('<path d="M4 7h16M4 12h16M4 17h10"/>'),
  ai:svg('<rect x="5" y="7" width="14" height="11" rx="3"/><path d="M12 4v3M9 11h.01M15 11h. 01M10 14h4"/>'),
  know:svg('<path d="M12 3a6 6 0 0 1 6 6c0 2-1 3-1 5H7c0-2-1-3-1-5a6 6 0 0 1 6-6z"/><path d="M9 20h6"/>'),
  speak:svg('<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6.5a8 8 0 0 1 0 11"/>'),
  back:svg('<path d="M15 18l-6-6 6-,6"/>')
};

/* ============ 牌组配置 ============ */
var DECKS=[
  {key:'en', name:'英语 · 雅思词汇', desc:'1170 词 · 发音+例句+测试', type:'word', src:'ielts/ielts_bank.json', color:'linear-gradient(135deg,#1f6feb,#a371f7)', icon:'word', batch:20},
  {key:'ai', name:'AI 动态', desc:'38 条行业新闻与产品动态', type:'news', src:'assets/ai_cards.json', color:'linear-gradient(135deg,#ff8a5c,#ff5d8f)', icon:'ai', batch:15},
  {key:'kn', name:'知识卡片', desc:'35 篇 AI/历史/习惯/地理', type:'know', src:'assets/knowledge_cards.json', color:'linear-gradient(135deg,#46e6a0,#2fc1c1)', icon:'know', batch:15}
];

/* ============ 存储 ============ */
var PREFIX='wb_study_';
function g(k,def){try{var v=localStorage.getItem(PREFIX+k);return v===null?def:JSON.parse(v);}catch(e){return def;}}
function s(k,v){try{localStorage.setItem(PREFIX+k,JSON.stringify(v));}catch(e){toast('存储失败，空间可能已满');}}

var G={
  xp:g('xp',0),
  lastDay:g('lastDay',''),
  dailyDone:g('dailyDone',{}), // {date: count}
  decks:{} // key -> {known:[], unknown:[], seen:[]}
};
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function awardXp(n){G.xp+=n;s('xp',G.xp);document.getElementById('xpChip').textContent='XP '+G.xp;}

/* ============ 牌组进度 ============ */
function deckState(key){ if(!G.decks[key]) G.decks[key]={known:[],unknown:[],seen:[]}; return G.decks[key]; }
function saveDecks(){s('decks',G.decks);}
function deckProgress(key,total){ var d=deckState(key); var known=d.known.length; var pct= total? Math.round(known/total*100):0; return {known:known,total:total,pct:pct}; }

/* ============ 加载数据 ============ */
var cache={};
function loadDeck(deck,cb){
  if(cache[deck.key]){cb(cache[deck.key]);return;}
  fetch(deck.src).then(function(r){return r.json();}).then(function(data){
    var items;
    if(deck.type==='word'){ items=data; }
    else { items=data.cards||[]; }
    cache[deck.key]=items; cb(items);
  }).catch(function(){ toast('数据加载失败（需通过 http 打开）'); });
}

/* ============ 渲染首页 ============ */
function renderHome(){
  document.getElementById('view-home').style.display='';
  document.getElementById('view-learn').style.display='none';
  document.getElementById('view-result').style.display='none';
  document.getElementById('xpChip').textContent='XP '+G.xp;
  var box=document.getElementById('deckList'); var h='';
  DECKS.forEach(function(d){
    loadDeck(d,function(items){
      var p=deckProgress(d.key, items.length);
      var prog=document.getElementById('deckProg_'+d.key);
      if(prog){ prog.style.width=p.pct+'%'; }
      var meta=document.getElementById('deckMeta_'+d.key);
      if(meta){ meta.textContent= p.known+' / '+p.total+' 已掌握 ('+p.pct+'%)'; }
    });
    h+='<div class="deck" data-key="'+d.key+'" style="background:linear-gradient(135deg,'+d.color.replace('135deg','160deg')+',rgba(255,255,255,.02))">'
      +'<div class="row">'
      +'<div class="emoji-box" style="background:'+d.color+'">'+ICONS[d.icon]+'</div>'
      +'<div class="info"><div class="dn">'+d.name+'</div><div class="dd">'+d.desc+'</div></div>'
      +'</div>'
      +'<div class="prog"><i id="deckProg_'+d.key+'"></i></div>'
      +'<div class="meta"><span id="deckMeta_'+d.key+'">加载中…</span><span class="go">开始 →</span></div>'
      +'</div>';
  });
  box.innerHTML=h;
  box.querySelectorAll('.deck').forEach(function(el){
    el.addEventListener('click',function(){ startDeck(el.getAttribute('data-key')); });
  });
}

/* ============ 学习会话 ============ */
var cur=null; // {deck, items, queue, idx, known, unknown}
function startDeck(key){
  var deck=DECKS.filter(function(d){return d.key===key;})[0];
  loadDeck(deck,function(items){
    var st=deckState(key);
    // 优先复习未掌握的，再放未学过的
    var unseen=items.filter(function(it){return st.known.indexOf(idOf(deck,it))<0 && st.unknown.indexOf(idOf(deck,it))<0;});
    var review=items.filter(function(it){return st.unknown.indexOf(idOf(deck,it))>=0;});
    var pool=review.concat(unseen);
    // 打乱
    pool=pool.sort(function(){return Math.random()-0.5;});
    var n=Math.min(deck.batch, pool.length);
    cur={deck:deck, items:pool.slice(0,n), idx:0, known:0, unknown:0, total:n};
    if(n===0){ toast('该牌组已学完，去复习模式看看～'); return; }
    document.getElementById('view-home').style.display='none';
    document.getElementById('view-learn').style.display='';
    renderCard();
  });
}
function idOf(deck,it){ return deck.type==='word'? it.word : (it.title||it.href); }

function renderCard(){
  var it=cur.items[cur.idx];
  var d=cur.deck;
  var front=document.getElementById('faceFront');
  var back=document.getElementById('faceBack');
  var c3d=document.getElementById('card3d');
  c3d.classList.remove('flip-on');

  if(d.type==='word'){
    front.innerHTML='<div class="ft">单词</div><div class="big">'+esc(it.word)+'</div><div class="ipa">'+esc(it.ipa||'')+'</div>'
      +'<div class="hint">点击卡片看释义 · 右下角可发音</div>';
    var audioHtml = audioBtn(it.word);
    back.innerHTML='<div class="ft">释义</div><div class="pos">'+esc(it.pos||'')+'</div>'
      +'<div class="ex-en">'+esc(it.en||'')+'</div>'
      +'<div class="ex-cn">'+esc(it.cn||'')+'</div>'
      +'<div class="hint">点击卡片返回</div>'+audioHtml;
  } else if(d.type==='news'){
    front.innerHTML='<div class="ft">AI 动态</div><span class="tag-pill">'+(it.tag||'AI')+'</span><div class="title-front">'+esc(it.title)+'</div>'
      +'<div class="hint">点击卡片看解读</div>';
    back.innerHTML='<div class="ft">解读</div><div class="summary">'+(it.summary||'')+'</div>'
      +(it.impact?'<div class="summary" style="color:var(--cyan)">📌 '+(it.impact)+'</div>':'')
      +(it.uses?'<div class="summary" style="color:var(--green)">💡 '+(it.uses)+'</div>':'')
      +(it.source?'<div class="source">来源：'+(it.source)+' · '+esc(it.date||'')+'</div>':'')
      +'<div class="hint">点击卡片返回</div>';
  } else {
    front.innerHTML='<div class="ft">知识卡片</div><span class="tag-pill">'+(it.cat||'知识')+'</span><div class="title-front">'+esc(it.title)+'</div>'
      +'<div class="hint">点击卡片看讲解</div>';
    back.innerHTML='<div class="ft">讲解</div><div class="summary">'+(it.summary||'')+'</div>'
      +(it.href?'<div class="source"><a href="'+esc(it.href)+'" style="color:var(--cyan)">→ 阅读全文</a></div>':'')
      +'<div class="hint">点击卡片返回</div>';
  }

  var pct=Math.round(cur.idx/cur.total*100);
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progCnt').textContent=(cur.idx+1)+' / '+cur.total;
}
function audioBtn(word){
  var u='ielts/audio/'+encodeURIComponent(word)+'_us.mp3';
  return '<div class="speaker" onclick="playAudio(\''+word.replace(/'/g,"\\'")+'\')">'+ICONS.speak+'</div>';
}
function playAudio(word){
  var a=document.getElementById('audio');
  a.src='ielts/audio/'+encodeURIComponent(word)+'_us.mp3';
  a.play().catch(function(){ toast('无音频或需 http 环境'); });
}

document.getElementById('card3d').addEventListener('click',function(){
  this.classList.toggle('flip-on');
});

function answer(known){
  var it=cur.items[cur.idx];
  var id=idOf(cur.deck,it);
  var st=deckState(cur.deck.key);
  // 移出旧状态
  st.known=st.known.filter(function(x){return x!==id;});
  st.unknown=st.unknown.filter(function(x){return x!==id;});
  if(st.seen.indexOf(id)<0) st.seen.push(id);
  if(known){
    st.known.push(id);
    cur.known++; awardXp(2);
  } else {
    st.unknown.push(id);
    cur.unknown++;
  }
  saveDecks();
  cur.idx++;
  if(cur.idx>=cur.total){ finishSession(); }
  else { renderCard(); }
}
document.getElementById('btnYes').addEventListener('click',function(){answer(true);});
document.getElementById('btnNo').addEventListener('click',function(){answer(false);});

function finishSession(){
  saveDecks();
  var rate=Math.round(cur.known/cur.total*100);
  // 记录当日累计
  var t=todayStr(); if(!G.dailyDone[t])G.dailyDone[t]=0; G.dailyDone[t]+=cur.total; s('dailyDone',G.dailyDone);
  document.getElementById('view-learn').style.display='none';
  document.getElementById('view-result').style.display='';
  document.getElementById('resRate').textContent=rate+'%';
  document.getElementById('resText').textContent='本轮 '+cur.total+' 张 · 认识 '+cur.known+' · 不认识 '+cur.unknown+' · +'+(cur.known*2)+' XP';
}
document.getElementById('againBtn').addEventListener('click',function(){ startDeck(cur.deck.key); });
document.getElementById('homeBtn').addEventListener('click',renderHome);
document.getElementById('backHome').addEventListener('click',renderHome);
document.getElementById('backHome2').addEventListener('click',renderHome);

/* ============ 备份 ============ */
function exportData(){
  var data={xp:G.xp,lastDay:G.lastDay,dailyDone:G.dailyDone,decks:G.decks,exportedAt:new Date().toISOString()};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zheshao-study-backup.json';a.click();
  toast('已导出备份');
}
function importData(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      ['xp','lastDay','dailyDone','decks'].forEach(function(k){ if(k in d) G[k]=d[k]; });
      ['xp','lastDay','dailyDone','decks'].forEach(function(k){ s(k,G[k]); });
      renderHome(); toast('导入成功');
    }catch(e){ toast('文件格式错误'); }
  };
  r.readAsText(file);
}
document.getElementById('expBtn').addEventListener('click',exportData);
document.getElementById('impBtn').addEventListener('click',function(){document.getElementById('impFile').click();});
document.getElementById('impFile').addEventListener('change',function(e){if(e.target.files[0])importData(e.target.files[0]);});

/* ============ toast ============ */
var toastTimer;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on');},1600);}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
