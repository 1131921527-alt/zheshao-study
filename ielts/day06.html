function tts(text, lang){
  try{ if(!window.speechSynthesis) return; var u=new SpeechSynthesisUtterance(text); u.lang=lang||'en-US'; u.rate=0.95; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); }catch(e){}
}
function playWord(word, type) {
  var audio = new Audio('audio/' + word.toLowerCase() + (type === 1 ? '_uk.mp3' : '_us.mp3'));
  audio.play().catch(function() {
    var url = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=' + type;
    var a = new Audio(url); a.play().catch(function() { tts(word, type===1?'en-GB':'en-US'); });
  });
}
function playSentence(text){
  var key = text.replace(/<[^>]+>/g,'').trim().toLowerCase().substring(0,50);
  var file = _sentMap[key];
  if(file){ var a=new Audio(file); a.play().catch(function(){}); return; }
  var url='https://fanyi.baidu.com/gettts?lan=uk&spd=4&text='+encodeURIComponent(text);
  var a=new Audio(url); a.play().catch(function(){ tts(text,'en-US'); });
}
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function renderWords(){
  const list=shuffle(rawWords);
  const container=document.getElementById('words');
  container.innerHTML=list.map(w=>{
    const sents=w.sents.map((s,i)=>`<div class="sentence"><div class="sen-text"><div class="sen-en">${i+1}. ${s.en}</div><div class="sen-cn">${s.cn}</div></div><button class="play-btn" onclick="playSentence('${s.en.replace(/'/g,"\\'")}')">🔊</button></div>`).join('');
    return `<div class="card">
      <div class="word-row">
        <div>
          <div class="word">${w.word}</div>
          <div class="ipa">${w.ipa}</div>
        </div>
        <div class="tts-btns">
          <button onclick="playWord('${w.word}',1)">🇬🇧 GB</button>
          <button onclick="playWord('${w.word}',2)">🇺🇸 US</button>
        </div>
      </div>
      <div class="meaning"><span class="pos">${w.pos}</span> ${w.mean}</div>
      <div class="emoji-card">${w.emoji}</div>
      <div class="story"><strong>记忆故事</strong><br>${w.story}</div>
      <div class="tip"><strong>用法提示</strong><br>${w.tip}</div>
      <div class="sentences">
        <div class="sent-title">例句</div>
        ${sents}
      </div>
    </div>`;
  }).join('');
}
renderWords();
