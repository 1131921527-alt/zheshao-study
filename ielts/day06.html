var currentOrder = [];
for (var k = 0; k < RAW.length; k++) currentOrder.push(k);

function render(){
  var h = '';
  for (var j = 0; j < currentOrder.length; j++){
    h += buildCard(RAW[currentOrder[j]], currentOrder[j]);
  }
  $('cards').innerHTML = h;
  window.scrollTo({top:0,behavior:'smooth'});
}

function shuffleCards(){
  for (var i = currentOrder.length - 1; i > 0; i--){
    var r = Math.floor(Math.random() * (i + 1));
    var tmp = currentOrder[i];
    currentOrder[i] = currentOrder[r];
    currentOrder[r] = tmp;
  }
  render();
}

var playQueue = [];
var playIdx = 0;
function playAll(){
  playQueue = currentOrder.slice();
  playIdx = 0;
  playNext();
}
function playNext(){
  if (playIdx >= playQueue.length) return;
  var wi = playQueue[playIdx];
  var cardEl = document.querySelector('.card[data-idx="' + wi + '"]');
  if (cardEl) cardEl.scrollIntoView({behavior:'smooth',block:'start'});
  playWord(RAW[wi].word, 'gb');
  player.onended = function(){ playIdx++; playNext(); };
}

function initShuffle(){
  for (var i = currentOrder.length - 1; i > 0; i--){
    var r = Math.floor(Math.random() * (i + 1));
    var tmp = currentOrder[i];
    currentOrder[i] = currentOrder[r];
    currentOrder[r] = tmp;
  }
}

initShuffle();
render();
</script>

<script>
(function(){
  var w=['周日','周一','周二','周三','周四','周五','周六'];
  function p(n){return (n<10?'0':'')+n;}
  function tick(){
    var d=new Date();
    var dt=document.getElementById('lcDate');
    if(dt) dt.textContent=d.getFullYear()+'年'+p(d.getMonth()+1)+'月'+p(d.getDate())+'日 '+w[d.getDay()];
    var h=document.getElementById('lcH'),m=document.getElementById('lcM'),s=document.getElementById('lcS'),b=document.getElementById('lcBar');
    if(h)h.textContent=p(d.getHours());
    if(m)m.textContent=p(d.getMinutes());
    if(s)s.textContent=p(d.getSeconds());
    if(b)b.style.width=(d.getSeconds()/60*100)+'%';
  }
  tick();setInterval(tick,1000);
  window.lcZoom=function(img){ if(img&&img.src) window.open(img.src,'_blank'); };

})();
