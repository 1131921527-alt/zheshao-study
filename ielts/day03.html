function tts(text, lang){
  try{ if(!window.speechSynthesis) return; var u=new SpeechSynthesisUtterance(text); u.lang=lang||'en-US'; u.rate=0.95; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); }catch(e){}
}
function playWord(word, type) {
  var audio = new Audio('audio/' + word.toLowerCase() + (type === 1 ? '_uk.mp3' : '_us.mp3'));
  audio.play().catch(function() {
    var url = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=' + type;
    var a = new Audio(url); a.play().catch(function() { tts(word, type===1?'en-GB':'en-US'); });
  });
}

function playSentence(text){
  var key = text.replace(/<[^>]+>/g,'').trim().toLowerCase().substring(0,50);
  var file = _sentMap[key];
  if(file){ var a=new Audio(file); a.play().catch(function(){}); return; }
  var url='https://fanyi.baidu.com/gettts?lan=uk&spd=4&text='+encodeURIComponent(text);
  var a=new Audio(url); a.play().catch(function(){ tts(text,'en-US'); });
}

function renderCards(){
const container=document.getElementById('cards-container');
shuffleArray(vocabData);
let html='';
vocabData.forEach((item,idx)=>{
html+=`<div class="card">
<div class="emoji-box"><div class="emoji-card ${item.gc}">${item.emoji}</div></div>
<div class="word-title">${item.word}</div>
<div class="phonetic">${item.ipa}</div>
<div class="meaning">${item.pos} ${item.meaning}</div>
<div class="sound-btns">
<button class="sound-btn" onclick="playWord('${item.word}',1)">🇬🇧 GB</button>
<button class="sound-btn" onclick="playWord('${item.word}',2)">🇺🇸 US</button>
</div>
<div class="story-box"><div class="label">📖 记忆故事</div>${item.story}</div>
<div class="usage-tip"><div class="label">💡 用法提示</div>${item.usage}</div>
<div class="examples">
<div class="label" style="color:#58a6ff;font-weight:600;margin-bottom:6px">📝 例句</div>
${item.examples.map(ex=>`<div class="ex-item">

<div class="cn">${ex.cn}</div>
<button class="play-btn" onclick="playSentence('${ex.en.replace(/'/g,"\\'")}')">🔊 播放</button>

</div>
</div>`;
});
container.innerHTML=html;
}
