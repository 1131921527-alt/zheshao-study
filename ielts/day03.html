function shuffleArray(arr){
for(let i=arr.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}
}

function playWord(word,type){
const url=`https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(word)}&type=${type}`;
const a=new Audio(url);
a.play();
}

function playSentence(text){
const url=`https://fanyi.baidu.com/gettts?lan=uk&spd=4&text=${encodeURIComponent(text)}`;
const a=new Audio(url);
a.play();
}

let html='';

<div class="word-title">${item.word}</div>
<div class="phonetic">${item.ipa}</div>
<div class="meaning">${item.pos} ${item.meaning}</div>
<div class="sound-btns">
<button class="sound-btn" onclick="playWord('${item.word}',1)">🇬🇧 GB</button>
<button class="sound-btn" onclick="playWord('${item.word}',2)">🇺🇸 US</button>
</div>
<div class="story-box"><div class="label">📖 记忆故事</div>${item.story}</div>
<div class="usage-tip"><div class="label">💡 用法提示</div>${item.usage}</div>
<div class="examples">
<div class="label" style="color:#58a6ff;font-weight:600;margin-bottom:6px">📝 例句</div>
${item.examples.map(ex=>`<div class="ex-item">
<div class="en">${ex.en}</div>
<div class="cn">${ex.cn}</div>
<button class="play-btn" onclick="playSentence('${ex.en.replace(/'/g,"\\'")}')">🔊 播放</button>
</div>`).join('')}
</div>
</div>`;
});
container.innerHTML=html;
}

function shuffleCards(){renderCards();}

<script>
(function(){
  var w=['周日','周一','周二','周三','周四','周五','周六'];
  function p(n){return (n<10?'0':'')+n;}
  function tick(){
    var d=new Date();
    var dt=document.getElementById('lcDate');
    if(dt) dt.textContent=d.getFullYear()+'年'+p(d.getMonth()+1)+'月'+p(d.getDate())+'日 '+w[d.getDay()];
    var h=document.getElementById('lcH'),m=document.getElementById('lcM'),s=document.getElementById('lcS'),b=document.getElementById('lcBar');
    if(h)h.textContent=p(d.getHours());
    if(m)m.textContent=p(d.getMinutes());
    if(s)s.textContent=p(d.getSeconds());
    if(b)b.style.width=(d.getSeconds()/60*100)+'%';
  }
  tick();setInterval(tick,1000);
  window.lcZoom=function(img){ if(img&&img.src) window.open(img.src,'_blank'); };
  window.lcCopyWx=function(){
    var id="Harryalwayslucky";
    if(!id) return;
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(id).then(function(){alert('微信号已复制：'+id);}); }
    else { var t=document.createElement('textarea'); t.value=id; document.body.appendChild(t); t.select(); try{document.execCommand('copy');alert('微信号已复制：'+id);}catch(e){} document.body.removeChild(t); }
  };
})();
</script></body>
</html>
