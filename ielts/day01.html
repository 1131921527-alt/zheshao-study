<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>雅思核心词汇 Day 01</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  padding: 0;
  background: #0d1117;
  color: #e6edf3;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height: 1.6;
}
.container { max-width: 640px; margin: 0 auto; padding: 16px; }
header {
  text-align: center;
  padding: 24px 0 16px;
  border-bottom: 1px solid #30363d;
  margin-bottom: 20px;
}
header h1 { margin: 0 0 6px; font-size: 1.6rem; color: #f0f6fc; }
header p { margin: 0; color: #8b949e; font-size: 0.95rem; }
.btn-shuffle {
  display: inline-block;
  margin-top: 12px;
  padding: 8px 18px;
  background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
  color: #fff;
  border: none;
  border-radius: 20px;
  font-size: 0.95rem;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(35,134,54,0.25);
}
.word-card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
}
.word-header { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.emoji-box {
  width: 64px; height: 64px; min-width: 64px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.2rem;
  background: linear-gradient(135deg, #1f6feb 0%, #a371f7 100%);
  box-shadow: 0 4px 12px rgba(31,111,235,0.25);
}
.word-title { flex: 1; }
.word-en { font-size: 1.7rem; font-weight: 700; color: #f0f6fc; letter-spacing: 0.5px; }
.word-ipa { color: #8b949e; font-size: 0.95rem; margin-top: 2px; }
.word-pos { color: #79c0ff; font-size: 0.95rem; margin-top: 4px; }
.word-meaning { color: #c9d1d9; font-size: 0.95rem; margin-top: 2px; }
.tts-row { display: flex; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
.tts-btn {
  background: #21262d;
  border: 1px solid #30363d;
  color: #c9d1d9;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 0.85rem;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
}
.tts-btn:active { background: #30363d; }
.story-box {
  background: #21262d;
  border-left: 3px solid #f0883e;
  border-radius: 8px;
  padding: 10px 12px;
  margin: 12px 0;
  font-size: 0.92rem;
  color: #c9d1d9;
}
.tip-box {
  background: #21262d;
  border-left: 3px solid #3fb950;
  border-radius: 8px;
  padding: 10px 12px;
  margin: 12px 0;
  font-size: 0.9rem;
  color: #8b949e;
}
.sentences { margin-top: 12px; }
.sentence {
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
}
.sentence-en { color: #e6edf3; font-size: 0.95rem; margin-bottom: 4px; }
.sentence-cn { color: #8b949e; font-size: 0.88rem; margin-bottom: 8px; }
footer { text-align: center; padding: 24px 0 40px; color: #6e7681; font-size: 0.85rem; }
/* ===== 泽少学习助手 · 玻璃圆形时钟抬头（统一组件） ===== */
.gh{position:sticky;top:0;z-index:100;padding:13px 16px 12px;overflow:hidden;border:none;margin:0;text-align:left;background:transparent}
.gh-glass{position:absolute;inset:0;background:linear-gradient(135deg,rgba(20,28,46,.74),rgba(10,14,23,.56));backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid rgba(201,168,106,.22);box-shadow:0 6px 24px rgba(0,0,0,.35)}
.gh-inner{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:720px;margin:0 auto}
.gh-brand{display:flex;align-items:center;gap:11px;min-width:0}
.gh-logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#C9A86A,#8A6E33);box-shadow:0 4px 12px rgba(201,168,106,.35),inset 0 1px 0 rgba(255,255,255,.25);flex:0 0 auto}
.gh-titles{min-width:0}
.gh-title{font-size:17px;font-weight:800;color:#E9EDF6;margin:0;line-height:1.25;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh-sub{font-size:11.5px;color:#A7B0C2;margin-top:3px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh-clock-wrap{display:flex;flex-direction:column;align-items:center;flex:0 0 auto}
.gh-clock{width:50px;height:50px;display:block}
.gh-clock .gh-face{fill:rgba(255,255,255,.04)}
.gh-clock .gh-ring{fill:none;stroke:url(#ghGold);stroke-width:2.4}
.gh-clock .gh-tick{stroke:rgba(201,168,106,.5)}
.gh-clock .gh-hand-h{stroke:#C9A86A;stroke-width:3;stroke-linecap:round}
.gh-clock .gh-hand-m{stroke:#E9EDF6;stroke-width:2;stroke-linecap:round}
.gh-clock .gh-hand-s{stroke:#4F8DFF;stroke-width:1.2;stroke-linecap:round}
.gh-clock .gh-cap{fill:#0B0F17;stroke:#4F8DFF;stroke-width:.6}
.gh-digital{font-size:12px;font-weight:700;color:#E9EDF6;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.gh-caption{font-size:9.5px;color:#A7B0C2;letter-spacing:1px;margin-top:1px;font-style:italic;opacity:.85}
.gh-actions{position:relative;display:flex;justify-content:center;padding-top:10px}
</style>
</head>

<script>

var legacyAudioQueue=[];
var legacyAudioBusy=false;
function runLegacyAudio(){
  if(legacyAudioBusy||!legacyAudioQueue.length)return;
  legacyAudioBusy=true;
  var job=legacyAudioQueue.shift();
  var a=new Audio(job.url);
  var done=function(){legacyAudioBusy=false;runLegacyAudio();};
  a.onended=done;a.onerror=done;a.play().catch(done);
}
function queueLegacyAudio(url){legacyAudioQueue.push({url:url});runLegacyAudio();}
function playAudio(url) {
  const a = new Audio(url);
  a.play().catch(() => {});
}

function render(list) {
  const container = document.getElementById('word-list');
  container.innerHTML = list.map((w, i) => `
    <div class="word-card">
      <div class="word-header">
        <div class="emoji-box">${w.emoji}</div>
        <div class="word-title">
          <div class="word-en">${w.en}</div>
          <div class="word-ipa">${w.ipa}</div>
          <div class="word-pos">${w.pos} <span class="word-meaning">${w.meaning}</span></div>
        </div>
      </div>
      <div class="tts-row">
        <button class="tts-btn" onclick="playAudio('https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(w.en)}&type=1')">🇬🇧 GB</button>
        <button class="tts-btn" onclick="playAudio('https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(w.en)}&type=2')">🇺🇸 US</button>
      </div>
      <div class="story-box">🧠 ${w.story}</div>
      <div class="tip-box">💡 ${w.tip}</div>
      <div class="sentences">
        ${w.sentences.map((s, idx) => `
          <div class="sentence">
            <div class="sentence-en">${s.en}</div>
            <div class="sentence-cn">${s.cn}</div>
            <button class="tts-btn" onclick="playAudio('https://fanyi.baidu.com/gettts?lan=uk&spd=4&text=${encodeURIComponent(s.en)}')">🔊 例句${idx+1}</button>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function shuffleCards() {
  const shuffled = words.slice().sort(() => Math.random() - 0.5);
  render(shuffled);
}

shuffleCards();

<script>
/* audio-fix-v2: 本地 mp3 优先 + 浏览器 TTS 兜底（修复 Chrome 语音不发声问题） */
(function(){
  if(window.__audioFixV2) return; window.__audioFixV2 = true;

  /* ---- speechSynthesis 增强 ---- */
  var synth = window.speechSynthesis;
  var voices = [];
  function loadVoices(){
    if(!synth) return;
    voices = synth.getVoices() || [];
  }
  loadVoices();
  if(synth){
    if(synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
    setTimeout(loadVoices, 200);
    setTimeout(loadVoices, 1000);
  }

  function pickVoice(lang){
    if(!voices.length) loadVoices();
    for(var i=0;i<voices.length;i++){
      if(voices[i].lang === lang) return voices[i];
    }
    var base = lang.split('-')[0];
    for(var i=0;i<voices.length;i++){
      if(voices[i].lang.indexOf(base) === 0) return voices[i];
    }
    return null;
  }

  function tts(text, lang){
    if(!synth) return;
    try{
      if(synth.paused) synth.resume();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = lang || 'en-US';
      u.rate = 0.85;
      u.pitch = 1;
      u.volume = 1;
      var v = pickVoice(u.lang);
      if(v) u.voice = v;
      u.onend = function(){};
      u.onerror = function(e){};
      synth.speak(u);
    }catch(e){}
  }

  /* ---- 首次交互解锁 speechSynthesis（Chrome 需要用户激活） ---- */
  if(synth){
    function unlock(){
      try{
        var u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        u.rate = 1;
        synth.speak(u);
      }catch(e){}
    }
    document.addEventListener('pointerdown', unlock, {once:true, passive:true});
    document.addEventListener('click', unlock, {once:true, passive:true});
    document.addEventListener('touchstart', unlock, {once:true, passive:true});
  }

  /* ---- playAudio 重写 ---- */
  window.playAudio = function(url){
    /* 有道 URL → 单词发音 */
    var m = url.match(/dict\.youdao\.com\/dictvoice\?audio=([^&]+)&type=(\d)/);
    if(m){
      var w = decodeURIComponent(m[1]);
      var tp = parseInt(m[2]);
      var f = 'audio/' + w.toLowerCase() + (tp === 1 ? '_uk.mp3' : '_us.mp3');
      var a = new Audio(f);
      a.play().then(function(){}).catch(function(){
        /* 本地 mp3 没有或播放失败 → speechSynthesis */
        tts(w, tp === 1 ? 'en-GB' : 'en-US');
      });
      return;
    }
    /* 百度 URL → 例句发音 */
    var m2 = url.match(/fanyi\.baidu\.com\/gettts\?.*text=([^&]+)/);
    if(m2){
      var text = decodeURIComponent(m2[1]);
      /* 尝试本地例句 mp3（用 md5 hash 前12位命名，和下载脚本一致） */
      /* 浏览器端算不了 md5，直接用 speechSynthesis */
      tts(text, 'en-US');
      return;
    }
    /* 其他 URL 直接播放 */
    try{ new Audio(url).play().catch(function(){}); }catch(e){}
  };
})();
</script>
