<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>雅思核心词汇 Day 01</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  padding: 0;
  background: #0d1117;
  color: #e6edf3;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height: 1.6;
}
.container { max-width: 640px; margin: 0 auto; padding: 16px; }
header {
  text-align: center;
  padding: 24px 0 16px;
  border-bottom: 1px solid #30363d;
  margin-bottom: 20px;
}
header h1 { margin: 0 0 6px; font-size: 1.6rem; color: #f0f6fc; }
header p { margin: 0; color: #8b949e; font-size: 0.95rem; }
.btn-shuffle {
  display: inline-block;
  margin-top: 12px;
  padding: 8px 18px;
  background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
  color: #fff;
  border: none;
  border-radius: 20px;
  font-size: 0.95rem;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(35,134,54,0.25);
}
.word-card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
}
.word-header { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.emoji-box {
  width: 64px; height: 64px; min-width: 64px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.2rem;
  background: linear-gradient(135deg, #1f6feb 0%, #a371f7 100%);
  box-shadow: 0 4px 12px rgba(31,111,235,0.25);
}
.word-title { flex: 1; }
.word-en { font-size: 1.7rem; font-weight: 700; color: #f0f6fc; letter-spacing: 0.5px; }
.word-ipa { color: #8b949e; font-size: 0.95rem; margin-top: 2px; }
.word-pos { color: #79c0ff; font-size: 0.95rem; margin-top: 4px; }
.word-meaning { color: #c9d1d9; font-size: 0.95rem; margin-top: 2px; }
.tts-row { display: flex; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
.tts-btn {
  background: #21262d;
  border: 1px solid #30363d;
  color: #c9d1d9;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 0.85rem;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
}
.tts-btn:active { background: #30363d; }
.story-box {
  background: #21262d;
  border-left: 3px solid #f0883e;
  border-radius: 8px;
  padding: 10px 12px;
  margin: 12px 0;
  font-size: 0.92rem;
  color: #c9d1d9;
}
.tip-box {
  background: #21262d;
  border-left: 3px solid #3fb950;
  border-radius: 8px;
  padding: 10px 12px;
  margin: 12px 0;
  font-size: 0.9rem;
  color: #8b949e;
}
.sentences { margin-top: 12px; }
.sentence {
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
}
.sentence-en { color: #e6edf3; font-size: 0.95rem; margin-bottom: 4px; }
.sentence-cn { color: #8b949e; font-size: 0.88rem; margin-bottom: 8px; }
footer { text-align: center; padding: 24px 0 40px; color: #6e7681; font-size: 0.85rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>雅思核心词汇</h1>
    <p>Day 01 · 15 个精选单词</p>
    <button class="btn-shuffle" onclick="shuffleCards()">🔀 乱序重排</button>
  </header>
  <div id="word-list"></div>
  <footer>坚持学习，每天进步一点点</footer>
</div>
<script>
const words = [
  {
    en: "abandon", ipa: "/əˈbændən/", pos: "v.", meaning: "放弃，遗弃", emoji: "🏃",
    story: "一个(a)班(ban)的(don)人都放弃了他。",
    tip: "常接抽象名词，如 abandon hope/plan。",
    sentences: [
      { en: "They had to abandon their car in the snow.", cn: "他们只好在大雪中弃车。" },
      { en: "She never abandoned hope of finding her lost dog.", cn: "她从未放弃找回走失狗的希望。" },
      { en: "The plan was abandoned due to lack of funding.", cn: "该计划因缺乏资金而被放弃。" }
    ]
  },
  {
    en: "ability", ipa: "/əˈbɪləti/", pos: "n.", meaning: "能力，才能", emoji: "💪",
    story: "阿(a)比(bi)利(li)提(ty)着篮子展示了能力。",
    tip: "常见搭配：ability to do sth。",
    sentences: [
      { en: "She has the ability to solve complex problems.", cn: "她有能力解决复杂问题。" },
      { en: "The test measures students' reading ability.", cn: "这项测试衡量学生的阅读能力。" },
      { en: "With practice, you can improve your speaking ability.", cn: "通过练习，你可以提高口语能力。" }
    ]
  },
  {
    en: "absolute", ipa: "/ˈæbsəluːt/", pos: "adj.", meaning: "绝对的，完全的", emoji: "💯",
    story: "阿(a)伯(b)色(s)露(lu)天(te)发誓这是绝对的真理。",
    tip: "常见搭配：absolute zero/truth/silence。",
    sentences: [
      { en: "I have absolute confidence in your judgment.", cn: "我对你的判断有绝对的信心。" },
      { en: "The silence in the room was absolute.", cn: "房间里一片死寂。" },
      { en: "That's absolute nonsense!", cn: "那完全是胡说八道！" }
    ]
  },
  {
    en: "abundant", ipa: "/əˈbʌndənt/", pos: "adj.", meaning: "丰富的，充裕的", emoji: "🌾",
    story: "啊(a)！帮(bun)你 dent（撞凹）的车，资源很充裕。",
    tip: "常见搭配：abundant in。",
    sentences: [
      { en: "The region is abundant in wildlife.", cn: "这个地区野生动物丰富。" },
      { en: "We had abundant evidence to support our claim.", cn: "我们有充分的证据支持我们的主张。" },
      { en: "Rainfall is abundant in tropical areas.", cn: "热带地区降雨充沛。" }
    ]
  },
  {
    en: "accelerate", ipa: "/əkˈseləreɪt/", pos: "v.", meaning: "加速，促进", emoji: "🚀",
    story: "阿(a)克(ce)勒(le)瑞(re)特(te)踩油门加速。",
    tip: "常见搭配：accelerate growth/development。",
    sentences: [
      { en: "The car accelerated to over 100 miles per hour.", cn: "汽车加速到每小时100英里以上。" },
      { en: "We need to accelerate the process of reform.", cn: "我们需要加快改革进程。" },
      { en: "New technology will accelerate economic growth.", cn: "新技术将促进经济增长。" }
    ]
  },
  {
    en: "accessible", ipa: "/əkˈsesəbl/", pos: "adj.", meaning: "可接近的，易使用的", emoji: "🚪",
    story: "阿(a)克(ce)塞(ss)了(i)宝(b)珠(l)，所有人都能接近。",
    tip: "常见搭配：accessible to sb。",
    sentences: [
      { en: "The museum is accessible to wheelchair users.", cn: "这座博物馆轮椅使用者可进入。" },
      { en: "The information should be made accessible to everyone.", cn: "这些信息应该让每个人都能获取。" },
      { en: "Her writing style is highly accessible.", cn: "她的写作风格非常通俗易懂。" }
    ]
  },
  {
    en: "accommodate", ipa: "/əˈkɒmədeɪt/", pos: "v.", meaning: "容纳，适应，提供住宿", emoji: "🏨",
    story: "啊(a)！可(co)没(mm)地方(o)待(date)，快适应环境。",
    tip: "常见搭配：accommodate sb, accommodate to。",
    sentences: [
      { en: "The hotel can accommodate up to 500 guests.", cn: "这家酒店最多可容纳500位客人。" },
      { en: "I will accommodate my schedule to yours.", cn: "我会调整我的日程来配合你。" },
      { en: "We must accommodate the needs of elderly passengers.", cn: "我们必须满足老年乘客的需求。" }
    ]
  },
  {
    en: "accurate", ipa: "/ˈækjərət/", pos: "adj.", meaning: "精确的，准确的", emoji: "🎯",
    story: "AC 空调(ky)让鼠(rat)精确定位。",
    tip: "常见搭配：accurate information/description。",
    sentences: [
      { en: "The weather forecast was surprisingly accurate.", cn: "天气预报出奇地准确。" },
      { en: "Please give an accurate description of what happened.", cn: "请准确描述所发生的事。" },
      { en: "Her predictions proved to be highly accurate.", cn: "她的预测被证明非常准确。" }
    ]
  },
  {
    en: "achieve", ipa: "/əˈtʃiːv/", pos: "v.", meaning: "达到，实现，取得", emoji: "🏆",
    story: "阿(a)奇(chi)一(e)直追求，终于实现。",
    tip: "常见搭配：achieve a goal/success。",
    sentences: [
      { en: "She worked hard to achieve her ambitions.", cn: "她努力工作以实现抱负。" },
      { en: "The team achieved remarkable success this season.", cn: "该队本赛季取得了显著成功。" },
      { en: "You can achieve anything if you put your mind to it.", cn: "只要用心，你可以达成任何目标。" }
    ]
  },
  {
    en: "acknowledge", ipa: "/əkˈnɒlɪdʒ/", pos: "v.", meaning: "承认，致谢，理会", emoji: "🙏",
    story: "阿(a)克(k)nowledge（知识），承认知识的力量。",
    tip: "常见搭配：acknowledge that..., acknowledge receipt of。",
    sentences: [
      { en: "He refused to acknowledge that he had made a mistake.", cn: "他拒绝承认犯了错。" },
      { en: "I would like to acknowledge the help of my supervisor.", cn: "我要感谢导师的帮助。" },
      { en: "She didn't even acknowledge my presence.", cn: "她甚至没理会我在场。" }
    ]
  },
  {
    en: "acquire", ipa: "/əˈkwaɪə(r)/", pos: "v.", meaning: "获得，习得，收购", emoji: "📚",
    story: "阿(a)夸(k)我(qui)啊(re)！获得称赞。",
    tip: "常见搭配：acquire knowledge/skills, acquire a company。",
    sentences: [
      { en: "Students acquire language skills through practice.", cn: "学生通过练习习得语言技能。" },
      { en: "The company plans to acquire a smaller rival.", cn: "该公司计划收购一家较小的竞争对手。" },
      { en: "He acquired a valuable painting at the auction.", cn: "他在拍卖会上获得了一幅珍贵画作。" }
    ]
  },
  {
    en: "adequate", ipa: "/ˈædɪkwət/", pos: "adj.", meaning: "足够的，适当的", emoji: "✅",
    story: "啊(a)！弟(di)哭(ku)着 ate，吃的不够。",
    tip: "常见搭配：adequate for, adequate to。",
    sentences: [
      { en: "The food was adequate for our needs.", cn: "食物足够我们所需。" },
      { en: "Is there adequate parking near the stadium?", cn: "体育场附近有充足的停车位吗？" },
      { en: "Her training is adequate to the task.", cn: "她的培训足以胜任这项任务。" }
    ]
  },
  {
    en: "adjacent", ipa: "/əˈdʒeɪsnt/", pos: "adj.", meaning: "邻近的，毗邻的", emoji: "🏠",
    story: "啊(a)！杰(J)森(s)特(nt)就住在邻近的房间里。",
    tip: "常见搭配：adjacent to。",
    sentences: [
      { en: "The building adjacent to the school is being renovated.", cn: "学校隔壁的大楼正在翻新。" },
      { en: "We parked in the lot adjacent to the hotel.", cn: "我们把车停在酒店旁边的停车场。" },
      { en: "The two adjacent rooms share a bathroom.", cn: "两个相邻的房间共用一个浴室。" }
    ]
  },
  {
    en: "adjust", ipa: "/əˈdʒʌst/", pos: "v.", meaning: "调整，适应", emoji: "⚙️",
    story: "啊(a)！just 调整一下，刚刚好。",
    tip: "常见搭配：adjust to, adjust sth。",
    sentences: [
      { en: "It took him a while to adjust to college life.", cn: "他花了一段时间适应大学生活。" },
      { en: "Please adjust the volume on the TV.", cn: "请调整电视音量。" },
      { en: "We need to adjust our plans according to the weather.", cn: "我们需要根据天气调整计划。" }
    ]
  },
  {
    en: "administer", ipa: "/ədˈmɪnɪstə(r)/", pos: "v.", meaning: "管理，执行，给予（药物）", emoji: "💉",
    story: "ad（广告）迷(mini)思(ster)如何管理公司。",
    tip: "常见搭配：administer a test, administer medicine。",
    sentences: [
      { en: "The test was administered to all candidates.", cn: "所有考生都参加了这项测试。" },
      { en: "Nurses are trained to administer medication safely.", cn: "护士接受过安全给药培训。" },
      { en: "The agency administers federal funds.", cn: "该机构管理联邦资金。" }
    ]
  }
];

function playAudio(url) {
  const a = new Audio(url);
  a.play().catch(() => {});
}

function render(list) {
  const container = document.getElementById('word-list');
  container.innerHTML = list.map((w, i) => `
    <div class="word-card">
      <div class="word-header">
        <div class="emoji-box">${w.emoji}</div>
        <div class="word-title">
          <div class="word-en">${w.en}</div>
          <div class="word-ipa">${w.ipa}</div>
          <div class="word-pos">${w.pos} <span class="word-meaning">${w.meaning}</span></div>
        </div>
      </div>
      <div class="tts-row">
        <button class="tts-btn" onclick="playAudio('https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(w.en)}&type=1')">🇬🇧 GB</button>
        <button class="tts-btn" onclick="playAudio('https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(w.en)}&type=2')">🇺🇸 US</button>
      </div>
      <div class="story-box">🧠 ${w.story}</div>
      <div class="tip-box">💡 ${w.tip}</div>
      <div class="sentences">
        ${w.sentences.map((s, idx) => `
          <div class="sentence">
            <div class="sentence-en">${s.en}</div>
            <div class="sentence-cn">${s.cn}</div>
            <button class="tts-btn" onclick="playAudio('https://fanyi.baidu.com/gettts?lan=uk&spd=4&text=${encodeURIComponent(s.en)}')">🔊 例句${idx+1}</button>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function shuffleCards() {
  const shuffled = words.slice().sort(() => Math.random() - 0.5);
  render(shuffled);
}

shuffleCards();
</script>
<style>
#liveClockBar{position:fixed;top:0;left:0;right:0;z-index:99999;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;background:linear-gradient(90deg,#0b0f17 0%,#11182a 50%,#0b0f17 100%);border-bottom:1px solid rgba(120,170,255,.4);box-shadow:0 2px 18px rgba(0,0,0,.55),0 1px 0 rgba(88,166,255,.3) inset;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#c9d1d9;font-size:13px;overflow:hidden}
#liveClockBar .lc-dot{width:8px;height:8px;border-radius:50%;background:#3fb950;box-shadow:0 0 8px #3fb950;animation:lcPulse 1.4s infinite;flex:0 0 auto}
@keyframes lcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}
#liveClockBar .lc-date{color:#8b949e;white-space:nowrap}
#liveClockBar .lc-time{font-variant-numeric:tabular-nums;font-weight:700;color:#e6edf3;letter-spacing:.5px;font-size:15px}
#liveClockBar .lc-time #lcH,#liveClockBar .lc-time #lcM{color:#58a6ff}
#liveClockBar .lc-sec{color:#ff7b72}
#liveClockBar .lc-tag{margin-left:auto;color:#d2991d;font-size:11px;white-space:nowrap}
#liveClockBar .lc-bar{position:absolute;left:0;bottom:0;height:2px;background:linear-gradient(90deg,#58a6ff,#ff7b72);width:0%}
#liveClockBar .qr-copy{margin-left:auto;color:#58a6ff;font-size:12px;border:1px solid rgba(88,166,255,.4);border-radius:20px;padding:3px 10px;cursor:pointer;white-space:nowrap}
@media(max-width:430px){#liveClockBar .lc-tag{display:none}#liveClockBar .lc-date{font-size:11px}#liveClockBar .qr-copy{display:none}}
body{padding-top:44px!important}
</style>
<div id="liveClockBar">
<span class="lc-dot"></span>
<span class="lc-date" id="lcDate">--</span>
<span class="lc-time"><span id="lcH">--</span>:<span id="lcM">--</span>:<span class="lc-sec" id="lcS">--</span></span>
<span class="lc-tag">time goes by</span>
<i class="lc-bar" id="lcBar"></i>
</div>
<script>
(function(){
  var w=['周日','周一','周二','周三','周四','周五','周六'];
  function p(n){return (n<10?'0':'')+n;}
  function tick(){
    var d=new Date();
    var dt=document.getElementById('lcDate');
    if(dt) dt.textContent=d.getFullYear()+'年'+p(d.getMonth()+1)+'月'+p(d.getDate())+'日 '+w[d.getDay()];
    var h=document.getElementById('lcH'),m=document.getElementById('lcM'),s=document.getElementById('lcS'),b=document.getElementById('lcBar');
    if(h)h.textContent=p(d.getHours());
    if(m)m.textContent=p(d.getMinutes());
    if(s)s.textContent=p(d.getSeconds());
    if(b)b.style.width=(d.getSeconds()/60*100)+'%';
  }
  tick();setInterval(tick,1000);
  window.lcZoom=function(img){ if(img&&img.src) window.open(img.src,'_blank'); };
  window.lcCopyWx=function(){
    var id="Harryalwayslucky";
    if(!id) return;
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(id).then(function(){alert('微信号已复制：'+id);}); }
    else { var t=document.createElement('textarea'); t.value=id; document.body.appendChild(t); t.select(); try{document.execCommand('copy');alert('微信号已复制：'+id);}catch(e){} document.body.removeChild(t); }
  };
})();
</script><style>
