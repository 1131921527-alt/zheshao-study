function playTTS(text, type){
  var url;
  if(type==='gb') url='audio/'+text.toLowerCase()+'_uk.mp3';
  else if(type==='us') url='audio/'+text.toLowerCase()+'_us.mp3';
  else if(type==='ex'){
    var key=text.replace(/<[^>]+>/g,'').trim().toLowerCase().substring(0,50);
    url=_sentMap[key]||'';
  }
  if(!url) return;
  player.src=url;
  player.play().catch(function(e){console.log('播放失败',e);});
}

function playExample(btn, sentence){
  document.querySelectorAll('.ex-tts.playing').forEach(b=>b.classList.remove('playing'));
  btn.classList.add('playing');
  playTTS(sentence, 'ex');
  player.onended = () => btn.classList.remove('playing');
  player.onerror = () => btn.classList.remove('playing');
  setTimeout(()=>btn.classList.remove('playing'), 8000);
}

// ============ 渲染卡片 ============
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buildCard(w, idx){
  const examplesHtml = w.examples.map((ex)=>`
    <div class="ex-item">
      <div class="ex-en">${ex.en}</div>
      <div class="ex-cn">${ex.cn}</div>
      <button class="ex-tts" data-sent="${escapeHtml(ex.en)}" onclick="playExample(this, this.dataset.sent)">🔊 播放本句</button>
    </div>
  `).join('');

  return `
    <div class="card fade-in" data-idx="${idx}">
      <div class="card-top">
        <div class="emoji-box ${w.grad}">${w.emoji}</div>
        <div class="word-info">
          <div class="word-en">${w.word}</div>
          <div class="ipa">${w.ipa}</div>
          <div class="pos-mean"><span class="pos">${w.pos}</span>${w.mean}</div>
        </div>
      </div>
      <div class="tts-row">
        <button class="tts-btn gb" onclick="playTTS('${w.word}','gb')">🇬🇧 英音 GB</button>
        <button class="tts-btn us" onclick="playTTS('${w.word}','us')">🇺🇸 美音 US</button>
      </div>
      <div class="story"><span class="label">💡 记忆故事</span>${w.story}</div>
      <div class="usage"><span class="label">📝 用法提示</span>${w.usage}</div>
      <div class="examples-title">📖 例句（点击🔊逐句播放）</div>
      ${examplesHtml}
    </div>
  `;
}

let currentOrder = RAW.map((_,i)=>i);

function render(){
  const html = currentOrder.map(i=>buildCard(RAW[i], i)).join('');
  $('cards').innerHTML = html;
  window.scrollTo({top:0,behavior:'smooth'});
}

function shuffleCards(){
  currentOrder = [...currentOrder];
  for(let i=currentOrder.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [currentOrder[i],currentOrder[j]] = [currentOrder[j],currentOrder[i]];
  }
  render();
}

let playQueue = [];
let playIdx = 0;
function playAll(){
  playQueue = [...currentOrder];
  playIdx = 0;
  playNextInQueue();
}
function playNextInQueue(){
  if(playIdx >= playQueue.length){ playQueue=[]; return; }
  const w = RAW[playQueue[playIdx]];
  const card = document.querySelector(`.card[data-idx="${playQueue[playIdx]}"]`);
  if(card) card.scrollIntoView({behavior:'smooth',block:'start'});
  playTTS(w.word, 'gb');
  player.onended = ()=>{ playIdx++; playNextInQueue(); };
}

function initShuffle(){
  for(let i=currentOrder.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [currentOrder[i],currentOrder[j]] = [currentOrder[j],currentOrder[i]];
  }
}

initShuffle();
render();
</script>
