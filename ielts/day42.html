let sentenceQueue = [];
let sentenceBusy = false;
function finishSentence() {
  if (currentActiveBtn) currentActiveBtn.classList.remove('playing');
  currentActiveBtn = null;
  sentenceBusy = false;
  playNextSentence();
}
function playNextSentence() {
  if (sentenceBusy || sentenceQueue.length === 0) return;
  const item = sentenceQueue.shift();
  const text = item.text;
  const btn = item.btn;
  sentenceBusy = true;
  currentActiveBtn = btn;
  btn.classList.add('playing');
  var key = text.replace(/<[^>]+>/g, '').trim().toLowerCase().substring(0, 50);
  var file = _sentMap[key] || '';
  if (file) {
    PLAYER.src = file;
    PLAYER.onended = finishSentence;
    PLAYER.onerror = finishSentence;
    PLAYER.play().catch(finishSentence);
  } else if (window.speechSynthesis) {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.95;
    u.onend = finishSentence; u.onerror = finishSentence;
    window.speechSynthesis.speak(u);
  } else {
    setTimeout(finishSentence, 1400);
  }
}
function playSentence(text, btn) {
  sentenceQueue.push({ text: text, btn: btn });
  playNextSentence();
}

function stripTags(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}

function renderCards(words) {
  const container = document.getElementById('cards-container');
  const toc = document.getElementById('toc');
  let html = '';
  let tocHtml = '';

  words.forEach((w, idx) => {
    tocHtml += `<button class="toc-btn" onclick="document.getElementById('card-${w.id}').scrollIntoView({behavior:'smooth',block:'start'})">${w.en}</button>`;

    html += `<div class="card" id="card-${w.id}" data-original="${idx}">`;
    html += `<div class="card-top">`;
    html += `<div class="emoji-box ${w.grad}">${w.emoji}</div>`;
    html += `<div class="word-info">`;
    html += `<div class="word-num">No.${idx + 1} · 雅思核心</div>`;
    html += `<div class="word-en">${w.en}</div>`;
    html += `<div class="ipa">${w.ipa}</div>`;
    html += `<div class="pos-zh">${w.pos} ${w.zh}</div>`;
    html += `<div class="audio-btns">`;
    html += `<button class="audio-btn" onclick="event.stopPropagation();playWord('${w.en}',1)">🇬🇧 GB</button>`;
    html += `<button class="audio-btn" onclick="event.stopPropagation();playWord('${w.en}',2)">🇺🇸 US</button>`;
    html += `</div></div></div>`;
    html += `<div class="memory-story">${w.story}</div>`;
    html += `<div class="usage-tip"><span>📌</span><span>${w.tip}</span></div>`;
    html += `<div class="sentences">`;
    html += `<div class="sent-title">📝 例句</div>`;
    w.sentences.forEach((s, si) => {
      const plainText = stripTags(s.en);
      html += `<div class="sent-item">`;
      html += `<div class="sent-en">${si + 1}. ${s.en}</div>`;
      html += `<div class="sent-zh">${s.zh}</div>`;
      html += `<button class="sent-play" data-text="${plainText.replace(/"/g, '&quot;')}">🔊 播放</button>`;
      html += `</div>`;
    });
    html += `</div></div>`;
  });

  toc.innerHTML = tocHtml;
  container.innerHTML = html;

  // Attach sentence play handlers
  document.querySelectorAll('.sent-play').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      playSentence(this.dataset.text, this);
    });
  });
}

function shuffleCards() {
  const shuffled = [...WORDS].sort(() => Math.random() - 0.5);
  renderCards(shuffled);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetOrder() {
  renderCards([...WORDS]);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Init
renderCards([...WORDS]);
</script>
