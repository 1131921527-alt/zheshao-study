function renderCards(words){
  const c=document.getElementById('container');
  let html='';
  words.forEach((w,i)=>{
    const g='var(--g'+w.gradient+')';
    html+='<div class="word-card">';
    html+='<div class="emoji-box" style="background:'+g+'"><span class="emoji">'+w.emoji+'</span></div>';
    html+='<div class="word-info">';
    html+='<div class="word-head"><span class="en">'+w.en+'</span><span class="ipa">'+w.ipa+'</span></div>';
    html+='<div class="pos-cn">'+w.pos+' '+w.cn+'</div>';
    html+='<div class="audio-btns">';
    html+='<button onclick="playYoudao(\''+w.en+'\',1)">🇬🇧 GB</button>';
    html+='<button onclick="playYoudao(\''+w.en+'\',2)">🇺🇸 US</button>';
    html+='</div>';
    html+='<div class="story-box"><div class="label">🧠 记忆故事</div>'+w.story+'</div>';
    html+='<div class="tip-box"><div class="label">💡 用法提示</div>'+w.tip+'</div>';
    html+='<div class="examples"><div class="label-ex">📝 例句</div>';
    w.examples.forEach(ex=>{
      html+='<div class="ex-item">';
      html+='<div><div class="en-ex">'+ex[0]+'</div><div class="cn-ex">'+ex[1]+'</div></div>';
      html+='<button class="btn-play" onclick="playBaidu(\''+ex[0].replace(/'/g,"\\'")+'\')">🔊</button>';
      html+='</div>';
    });
    html+='</div></div></div>';
  });
  c.innerHTML=html;
}

function shuffleCards(){
  const arr=[...WORDS];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  renderCards(arr);
  window.scrollTo({top:0,behavior:'smooth'});
}
