function playBaidu(sentence){
  var key=sentence.replace(/<[^>]+>/g,'').trim().toLowerCase().substring(0,50);
  var f=_sentMap[key]||'';
  if(!f) return;
  var p=document.getElementById('player');
  p.src=f; p.load();
  p.play().catch(function(e){});
}

function playYoudao(word,type){
  var f='audio/'+word.toLowerCase()+(type===1?'_uk.mp3':'_us.mp3');
  var p=document.getElementById('player');
  p.src=f; p.load();
  p.play().catch(function(e){});
}

function renderCards(words){
  const c=document.getElementById('container');
  let html='';
  words.forEach((w,i)=>{
    const g='var(--g'+w.gradient+')';
    html+='<div class="word-card">';
    html+='<div class="emoji-box" style="background:'+g+'"><span class="emoji">'+w.emoji+'</span></div>';
    html+='<div class="word-info">';
    html+='<div class="word-head"><span class="en">'+w.en+'</span><span class="ipa">'+w.ipa+'</span></div>';
    html+='<div class="pos-cn">'+w.pos+' '+w.cn+'</div>';
    html+='<div class="audio-btns">';
    html+='<button onclick="playYoudao(\''+w.en+'\',1)">🇬🇧 GB</button>';
    html+='<button onclick="playYoudao(\''+w.en+'\',2)">🇺🇸 US</button>';
    html+='</div>';
    html+='<div class="story-box"><div class="label">🧠 记忆故事</div>'+w.story+'</div>';
    html+='<div class="tip-box"><div class="label">💡 用法提示</div>'+w.tip+'</div>';
    html+='<div class="examples"><div class="label-ex">📝 例句</div>';
    w.examples.forEach(ex=>{
      html+='<div class="ex-item">';
      html+='<div><div class="en-ex">'+ex[0]+'</div><div class="cn-ex">'+ex[1]+'</div></div>';
      html+='<button class="btn-play" onclick="playBaidu(\''+ex[0].replace(/'/g,"\\'")+'\')">🔊</button>';
      html+='</div>';
    });
    html+='</div></div></div>';
  });
  c.innerHTML=html;
}

function shuffleCards(){
  const arr=[...WORDS];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  renderCards(arr);
  window.scrollTo({top:0,behavior:'smooth'});
}

<script>
(function(){
  var w=['周日','周一','周二','周三','周四','周五','周六'];
  function p(n){return (n<10?'0':'')+n;}
  function tick(){
    var d=new Date();
    var dt=document.getElementById('lcDate');
    if(dt) dt.textContent=d.getFullYear()+'年'+p(d.getMonth()+1)+'月'+p(d.getDate())+'日 '+w[d.getDay()];
    var h=document.getElementById('lcH'),m=document.getElementById('lcM'),s=document.getElementById('lcS'),b=document.getElementById('lcBar');
    if(h)h.textContent=p(d.getHours());
    if(m)m.textContent=p(d.getMinutes());
    if(s)s.textContent=p(d.getSeconds());
    if(b)b.style.width=(d.getSeconds()/60*100)+'%';
  }
  tick();setInterval(tick,1000);
  window.lcZoom=function(img){ if(img&&img.src) window.open(img.src,'_blank'); };
  window.lcCopyWx=function(){
    var id="Harryalwayslucky";

    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(id).then(function(){alert('微信号已复制：'+id);}); }

  };
})();
