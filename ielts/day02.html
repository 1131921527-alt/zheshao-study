<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>雅思核心词汇 Day 02</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent2: #f778ba;
      --green: #3fb950;
      --yellow: #d29922;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      padding: 16px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
      color: #f0f6fc;
    }
    .header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 18px;
    }
    button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .word-list { display: flex; flex-direction: column; gap: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .card-top {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
    }
    .emoji-box {
      width: 72px;
      height: 72px;
      min-width: 72px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 8px 20px rgba(88, 166, 255, 0.2);
    }
    .word-info { flex: 1; }
    .word {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f0f6fc;
      letter-spacing: 0.5px;
    }
    .ipa {
      color: var(--accent);
      font-size: 0.95rem;
      margin-top: 2px;
    }
    .meaning {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .audio-btns {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .audio-btns button {
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 6px;
    }
    .card-body { padding: 14px 16px 16px; }
    .section { margin-bottom: 12px; }
    .section:last-child { margin-bottom: 0; }
    .section-title {
      font-size: 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .story {
      color: var(--text);
      font-size: 0.9rem;
      background: rgba(88, 166, 255, 0.08);
      padding: 10px 12px;
      border-radius: 10px;
      border-left: 3px solid var(--accent);
    }
    .tips {
      color: var(--text);
      font-size: 0.88rem;
    }
    .sentence {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .sentence:last-child { margin-bottom: 0; }
    .sentence-en {
      font-size: 0.9rem;
      color: #f0f6fc;
      margin-bottom: 4px;
    }
    .sentence-cn {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      font-size: 0.78rem;
      border-radius: 6px;
      background: transparent;
      color: var(--green);
      border: 1px solid var(--green);
    }
    .progress {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>雅思核心词汇 Day 02</h1>
    <p>15 个高频词 · 带发音 · 乱序复习</p>
  </div>

  <div class="controls">
    <button class="btn-primary" onclick="shuffleWords()">🔀 乱序</button>
    <button onclick="playAllWords()">▶️ 顺序播放单词</button>
  </div>

  <div class="word-list" id="wordList"></div>
  <div class="progress" id="progress"></div>

  <script>
    const originalWords = [
      {
        word: "ambiguous",
        ipa: "/æmˈbɪɡjuəs/",
        meaning: "adj. 模棱两可的，含糊不清的",
        emoji: "🌫️",
        story: "一片大雾（🌫️）里，路标指向两个方向，你根本看不清该走哪边——这就是 ambiguous，怎么看都有歧义。",
        tips: "常考态度题，作者说 ambiguous 通常表示不确定、没有明确立场。",
        sentences: [
          { en: "His answer was deliberately ambiguous.", cn: "他的回答故意含糊其辞。" },
          { en: "The contract contains several ambiguous clauses.", cn: "这份合同里有几个模棱两可的条款。" },
          { en: "The ending of the novel remains ambiguous.", cn: "这部小说的结局仍然耐人寻味。" }
        ]
      },
      {
        word: "comprehensive",
        ipa: "/ˌkɒmprɪˈhensɪv/",
        meaning: "adj. 全面的，综合的，详尽的",
        emoji: "🗂️",
        story: "把所有文件夹（🗂️）都摊开来，一个不落——comprehensive 就是全覆盖、无死角。",
        tips: "雅思阅读常出现 comprehensive survey / comprehensive review，表示“全面的调查/综述”。",
        sentences: [
          { en: "We need a comprehensive plan to solve this problem.", cn: "我们需要一个全面的计划来解决这个问题。" },
          { en: "The report provides a comprehensive analysis of the market.", cn: "这份报告对市场进行了全面分析。" },
          { en: "She has a comprehensive understanding of Chinese history.", cn: "她对中国历史有全面的了解。" }
        ]
      },
      {
        word: "detrimental",
        ipa: "/ˌdetrɪˈmentl/",
        meaning: "adj. 有害的，不利的",
        emoji: "☠️",
        story: "骷髅（☠️）一出现准没好事，detrimental 就是那种会带来损害、拖后腿的东西。",
        tips: "常用搭配 detrimental to health / the environment，注意拼写里的 -ment-。",
        sentences: [
          { en: "Smoking is detrimental to your health.", cn: "吸烟有害健康。" },
          { en: "The policy could be detrimental to small businesses.", cn: "这项政策可能对小型企业不利。" },
          { en: "Lack of sleep is detrimental to academic performance.", cn: "睡眠不足对学业表现有害。" }
        ]
      },
      {
        word: "eradicate",
        ipa: "/ɪˈrædɪkeɪt/",
        meaning: "v. 根除，消灭",
        emoji: "🔥",
        story: "一把火烧掉（🔥）杂草，连根拔起——eradicate 比 remove 更狠，是彻底根除。",
        tips: "常跟 disease / poverty / corruption 搭配，强调“从根上干掉”。",
        sentences: [
          { en: "The goal is to eradicate poverty by 2030.", cn: "目标是在2030年前消除贫困。" },
          { en: "Vaccines have helped eradicate smallpox.", cn: "疫苗帮助根除了天花。" },
          { en: "We must eradicate corruption from the system.", cn: "我们必须从体制中铲除腐败。" }
        ]
      },
      {
        word: "feasible",
        ipa: "/ˈfiːzəbl/",
        meaning: "adj. 可行的，行得通的",
        emoji: "🛠️",
        story: "看到工具（🛠️）就说明这事能干——feasible 就是现实可操作，不是空中楼阁。",
        tips: "写作里替换 possible 的高级词，feasible solution / feasible plan 很高频。",
        sentences: [
          { en: "Is it feasible to finish the project in two weeks?", cn: "两周内完成这个项目可行吗？" },
          { en: "Solar power is now a feasible alternative to fossil fuels.", cn: "太阳能现在是可以替代化石燃料的可行方案。" },
          { en: "We need to find a financially feasible solution.", cn: "我们需要找到一个经济上可行的解决方案。" }
        ]
      },
      {
        word: "hamper",
        ipa: "/ˈhæmpə(r)/",
        meaning: "v. 妨碍，阻碍 n. 篮子",
        emoji: "🧺",
        story: " hamper 本意是篮子（🧺），想象你被塞在篮子里动弹不得——所以它引申为“妨碍、拖慢”。",
        tips: "阅读态度题里 hamper 常等于 hinder / impede，后面接 progress / development / efforts。",
        sentences: [
          { en: "Bad weather hampered the rescue efforts.", cn: "恶劣天气阻碍了救援工作。" },
          { en: "High taxes can hamper economic growth.", cn: "高税收会阻碍经济增长。" },
          { en: "Lack of funding hampered our research.", cn: "资金不足妨碍了我们的研究。" }
        ]
      },
      {
        word: "imminent",
        ipa: "/ˈɪmɪnənt/",
        meaning: "adj. 即将发生的，迫近的",
        emoji: "⏰",
        story: "闹钟（⏰）马上就要响了，imminent 就是那种“下一秒就到”的紧迫感。",
        tips: "常考同义替换：imminent = about to happen / forthcoming，多形容危险、变化、威胁。",
        sentences: [
          { en: "The storm is imminent; we should leave now.", cn: "暴风雨即将来临，我们现在该走了。" },
          { en: "There is no sign of an imminent economic recovery.", cn: "没有经济即将复苏的迹象。" },
          { en: "The company faces imminent bankruptcy.", cn: "公司面临迫在眉睫的破产。" }
        ]
      },
      {
        word: "jeopardize",
        ipa: "/ˈdʒepərdaɪz/",
        meaning: "v. 危及，损害",
        emoji: "⚠️",
        story: "三角警告牌（⚠️）一亮，jeopardize 就是把事情置于危险之中，可能搞砸全局。",
        tips: "jeopardize 后常接 career / relationship / security / health，比 endanger 更书面。",
        sentences: [
          { en: "One mistake could jeopardize the entire mission.", cn: "一个错误就可能危及整个任务。" },
          { en: "He refused to do anything that would jeopardize his career.", cn: "他拒绝做任何可能危及事业的事。" },
          { en: "The scandal jeopardized the company’s reputation.", cn: "这起丑闻损害了公司的声誉。" }
        ]
      },
      {
        word: "lucid",
        ipa: "/ˈluːsɪd/",
        meaning: "adj. 清晰的，易懂的；神志清醒的",
        emoji: "💡",
        story: "灯泡（💡）一亮， lucid 就是思路像灯光一样清楚明白，让人一听就懂。",
        tips: "写作里形容 explanation / argument / style 很加分，lucid 强调清晰不绕弯。",
        sentences: [
          { en: "She gave a lucid explanation of the theory.", cn: "她对这一理论做了清晰的解释。" },
          { en: "Despite his age, he remains remarkably lucid.", cn: "尽管年事已高，他的头脑依然非常清醒。" },
          { en: "The essay is written in a clear and lucid style.", cn: "这篇文章写得清晰流畅。" }
        ]
      },
      {
        word: "meticulous",
        ipa: "/məˈtɪkjələs/",
        meaning: "adj. 一丝不苟的，细致的",
        emoji: "🔍",
        story: "拿着放大镜（🔍）一寸一寸检查，meticulous 就是那种追求细节、容不得瑕疵的认真。",
        tips: "常考同义替换：careful / thorough / painstaking，多形容 research / preparation / planning。",
        sentences: [
          { en: "He is meticulous about keeping records.", cn: "他对记录保存一丝不苟。" },
          { en: "The painting was the result of meticulous work.", cn: "这幅画是细致工作的成果。" },
          { en: "Her meticulous preparation impressed the interviewers.", cn: "她细致的准备给面试官留下了深刻印象。" }
        ]
      },
      {
        word: "novice",
        ipa: "/ˈnɒvɪs/",
        meaning: "n. 新手，初学者",
        emoji: "🐣",
        story: "刚破壳的小鸡（🐣）—— novice 就是还在学习走路、什么都不熟练的新手。",
        tips: "写作里 I am a novice at... 可以替换 beginner，更正式一点。",
        sentences: [
          { en: "As a novice, I still have a lot to learn.", cn: "作为新手，我还有很多要学。" },
          { en: "The course is designed for novices.", cn: "这门课是为初学者设计的。" },
          { en: "He is a novice at playing the piano.", cn: "他弹钢琴还是新手。" }
        ]
      },
      {
        word: "obscure",
        ipa: "/əbˈskjʊə(r)/",
        meaning: "v. 使模糊，掩盖 adj. 晦涩的",
        emoji: "🌑",
        story: "新月（🌑）把光线遮住，obscure 就是让事物变得不清楚、难理解、被掩盖。",
        tips: "常见搭配 obscure the fact / obscure the meaning，阅读里常表示“使难以理解”。",
        sentences: [
          { en: "The meaning of the poem is deliberately obscure.", cn: "这首诗的意思故意写得晦涩。" },
          { en: "Clouds obscured the view of the mountains.", cn: "云层遮住了山景。" },
          { en: "Legal jargon can obscure important information.", cn: "法律术语可能掩盖重要信息。" }
        ]
      },
      {
        word: "plausible",
        ipa: "/ˈplɔːzəbl/",
        meaning: "adj. 貌似合理的，似乎可信的",
        emoji: "🤔",
        story: "托腮思考（🤔）—— plausible 不是“真的”，而是“听起来好像有那么回事”。",
        tips: "雅思阅读里 plausible 常带一点怀疑色彩：看似合理，实则未必成立。",
        sentences: [
          { en: "Her story sounded plausible, but I didn’t believe it.", cn: "她的故事听起来可信，但我不信。" },
          { en: "There are several plausible explanations for the delay.", cn: "延误有几种貌似合理的解释。" },
          { en: "The theory is plausible but lacks solid evidence.", cn: "这个理论 plausible 但缺乏确凿证据。" }
        ]
      },
      {
        word: "redundant",
        ipa: "/rɪˈdʌndənt/",
        meaning: "adj. 多余的，冗余的；被裁员的",
        emoji: "📦",
        story: "角落里堆满了多余的箱子（📦），redundant 就是重复、没必要、可以扔掉的。",
        tips: "科技文里 redundant information / redundant systems 高频出现，注意也可指“裁员”。",
        sentences: [
          { en: "The report contains a lot of redundant information.", cn: "这份报告包含大量冗余信息。" },
          { en: "Many workers were made redundant due to automation.", cn: "由于自动化，许多工人被裁。" },
          { en: "Having two identical backups is redundant.", cn: "保留两份完全一样的备份是多余的。" }
        ]
      },
      {
        word: "skeptical",
        ipa: "/ˈskeptɪkl/",
        meaning: "adj. 怀疑的，持怀疑态度的",
        emoji: "🧐",
        story: "戴着单片眼镜（🧐）审视一切——skeptical 就是凡事不轻易相信，总要先挑挑刺。",
        tips: "写作和阅读超高频，be skeptical of / about 是固定搭配，常考作者态度。",
        sentences: [
          { en: "I am skeptical of his claims.", cn: "我对他的说法持怀疑态度。" },
          { en: "Scientists remain skeptical about the new treatment.", cn: "科学家对这种新疗法仍存疑虑。" },
          { en: "She gave him a skeptical look.", cn: "她怀疑地看了他一眼。" }
        ]
      }
    ];

    let words = [...originalWords];

    function playAudio(url) {
      const audio = new Audio(url);
      audio.play().catch(() => {});
    }

    function getWordAudio(word, type) {
      return `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(word)}&type=${type}`;
    }

    function getSentenceAudio(text, lang) {
      return `https://fanyi.baidu.com/gettts?lan=${lang}&spd=4&text=${encodeURIComponent(text)}`;
    }

    function render() {
      const list = document.getElementById('wordList');
      list.innerHTML = '';
      words.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-top">
            <div class="emoji-box">${item.emoji}</div>
            <div class="word-info">
              <div class="word">${index + 1}. ${item.word}</div>
              <div class="ipa">${item.ipa}</div>
              <div class="meaning">${item.meaning}</div>
              <div class="audio-btns">
                <button onclick="playAudio('${getWordAudio(item.word, 1)}')">🇬🇧 GB</button>
                <button onclick="playAudio('${getWordAudio(item.word, 2)}')">🇺🇸 US</button>
              </div>
            </div>
          </div>
          <div class="card-body">
            <div class="section">
              <div class="section-title">记忆故事</div>
              <div class="story">${item.story}</div>
            </div>
            <div class="section">
              <div class="section-title">用法提示</div>
              <div class="tips">${item.tips}</div>
            </div>
            <div class="section">
              <div class="section-title">例句</div>
              ${item.sentences.map((s, i) => `
                <div class="sentence">
                  <div class="sentence-en">${s.en}</div>
                  <div class="sentence-cn">${s.cn}</div>
                  <button class="play-btn" onclick="playAudio('${getSentenceAudio(s.en, 'uk')}')">🔊 英音</button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        list.appendChild(card);
      });
      document.getElementById('progress').textContent = `共 ${words.length} 词 · 完成 Day 02`;
    }

    function shuffleWords() {
      words.sort(() => Math.random() - 0.5);
      render();
    }

    function playAllWords() {
      let i = 0;
      function next() {
        if (i >= words.length) return;
        playAudio(getWordAudio(words[i].word, 2));
        i++;
        setTimeout(next, 1800);
      }
      next();
    }

    render();
  </script>
<style>
#liveClockBar{position:fixed;top:0;left:0;right:0;z-index:99999;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;background:linear-gradient(90deg,#0b0f17 0%,#11182a 50%,#0b0f17 100%);border-bottom:1px solid rgba(120,170,255,.4);box-shadow:0 2px 18px rgba(0,0,0,.55),0 1px 0 rgba(88,166,255,.3) inset;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#c9d1d9;font-size:13px;overflow:hidden}
#liveClockBar .lc-dot{width:8px;height:8px;border-radius:50%;background:#3fb950;box-shadow:0 0 8px #3fb950;animation:lcPulse 1.4s infinite;flex:0 0 auto}
@keyframes lcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}
#liveClockBar .lc-date{color:#8b949e;white-space:nowrap}
#liveClockBar .lc-time{font-variant-numeric:tabular-nums;font-weight:700;color:#e6edf3;letter-spacing:.5px;font-size:15px}
#liveClockBar .lc-time #lcH,#liveClockBar .lc-time #lcM{color:#58a6ff}
#liveClockBar .lc-sec{color:#ff7b72}
#liveClockBar .lc-tag{margin-left:auto;color:#d2991d;font-size:11px;white-space:nowrap}
#liveClockBar .lc-bar{position:absolute;left:0;bottom:0;height:2px;background:linear-gradient(90deg,#58a6ff,#ff7b72);width:0%}
#liveClockBar .qr-copy{margin-left:auto;color:#58a6ff;font-size:12px;border:1px solid rgba(88,166,255,.4);border-radius:20px;padding:3px 10px;cursor:pointer;white-space:nowrap}
@media(max-width:430px){#liveClockBar .lc-tag{display:none}#liveClockBar .lc-date{font-size:11px}#liveClockBar .qr-copy{display:none}}
body{padding-top:44px!important}
</style>
<div id="liveClockBar">
<span class="lc-dot"></span>
<span class="lc-date" id="lcDate">--</span>
<span class="lc-time"><span id="lcH">--</span>:<span id="lcM">--</span>:<span class="lc-sec" id="lcS">--</span></span>
<span class="lc-tag">time goes by</span>
<i class="lc-bar" id="lcBar"></i>
</div>
<script>
(function(){
  var w=['周日','周一','周二','周三','周四','周五','周六'];
  function p(n){return (n<10?'0':'')+n;}
  function tick(){
    var d=new Date();
    var dt=document.getElementById('lcDate');
    if(dt) dt.textContent=d.getFullYear()+'年'+p(d.getMonth()+1)+'月'+p(d.getDate())+'日 '+w[d.getDay()];
    var h=document.getElementById('lcH'),m=document.getElementById('lcM'),s=document.getElementById('lcS'),b=document.getElementById('lcBar');
    if(h)h.textContent=p(d.getHours());
    if(m)m.textContent=p(d.getMinutes());
    if(s)s.textContent=p(d.getSeconds());
    if(b)b.style.width=(d.getSeconds()/60*100)+'%';
  }
  tick();setInterval(tick,1000);
  window.lcZoom=function(img){ if(img&&img.src) window.open(img.src,'_blank'); };
  window.lcCopyWx=function(){
    var id="Harryalwayslucky";
    if(!id) return;
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(id).then(function(){alert('微信号已复制：'+id);}); }
    else { var t=document.createElement('textarea'); t.value=id; document.body.appendChild(t); t.select(); try{document.execCommand('copy');alert('微信号已复制：'+id);}catch(e){} document.body.removeChild(t); }
  };
})();
