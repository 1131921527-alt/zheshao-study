      font-size: 0.9rem;

      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;

      align-items: center;
      gap: 14px;
      padding: 16px;

      height: 72px;
      min-width: 72px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 8px 20px rgba(88, 166, 255, 0.2);

    .word-info { flex: 1; }
    .word {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f0f6fc;
      letter-spacing: 0.5px;
    }
    .ipa {
      color: var(--accent);
      font-size: 0.95rem;
      margin-top: 2px;
    }
    .meaning {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .audio-btns {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .audio-btns button {
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 6px;
    }
    .card-body { padding: 14px 16px 16px; }
    .section { margin-bottom: 12px; }
    .section:last-child { margin-bottom: 0; }
    .section-title {
      font-size: 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .story {
      color: var(--text);
      font-size: 0.9rem;
      background: rgba(88, 166, 255, 0.08);
      padding: 10px 12px;
      border-radius: 10px;
      border-left: 3px solid var(--accent);

    .tips {
      color: var(--text);
      font-size: 0.88rem;
    }

      background: rgba(255, 255, 255, 0.03);

      margin-bottom: 8px;

        var u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        u.rate = 1;
        synth.speak(u);
      }catch(e){}
    }
    document.addEventListener('pointerdown', unlock, {once:true, passive:true});
    document.addEventListener('click', unlock, {once:true, passive:true});
    document.addEventListener('touchstart', unlock, {once:true, passive:true});
  }

  /* ---- playAudio 重写 ---- */
  window.playAudio = function(url){
    /* 有道 URL → 单词发音 */
    var m = url.match(/dict\.youdao\.com\/dictvoice\?audio=([^&]+)&type=(\d)/);
    if(m){
      var w = decodeURIComponent(m[1]);
      var tp = parseInt(m[2]);
      var f = 'audio/' + w.toLowerCase() + (tp === 1 ? '_uk.mp3' : '_us.mp3');
      var a = new Audio(f);
      a.play().then(function(){}).catch(function(){
        /* 本地 mp3 没有或播放失败 → speechSynthesis */
        tts(w, tp === 1 ? 'en-GB' : 'en-US');
      });
      return;
    }
    /* 百度 URL → 例句发音 */
    var m2 = url.match(/fanyi\.baidu\.com\/gettts\?.*text=([^&]+)/);
    if(m2){
      var text = decodeURIComponent(m2[1]);
      /* 尝试本地例句 mp3（用 md5 hash 前12位命名，和下载脚本一致） */
      /* 浏览器端算不了 md5，直接用 speechSynthesis */
      tts(text, 'en-US');
      return;
    }
    /* 其他 URL 直接播放 */
    try{ new Audio(url).play().catch(function(){}); }catch(e){}
  };
})();
</script>
</body>
</html>
