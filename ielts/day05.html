<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雅思核心词汇 Day 05</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#c9d1d9; --head:#f0f6fc; --accent:#58a6ff; --sub:#8b949e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding:16px; }
  header { text-align:center; margin-bottom:18px; }
  h1 { margin:0; color:var(--head); font-size:1.6rem; }
  .day-tag { display:inline-block; margin-top:8px; padding:4px 12px; border-radius:999px; background:#21262d; color:var(--accent); font-size:0.9rem; border:1px solid var(--border); }
  .ctrl { text-align:center; margin-bottom:14px; }
  .btn-shuffle { background:#21262d; color:var(--accent); border:1px solid var(--border); padding:8px 18px; border-radius:999px; font-size:0.95rem; cursor:pointer; }
  .btn-shuffle:active { background:#30363d; }
  #words { display:flex; flex-direction:column; gap:18px; max-width:640px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px; }
  .word-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .word { font-size:1.65rem; font-weight:700; color:var(--head); letter-spacing:0.5px; }
  .ipa { color:var(--sub); font-size:0.95rem; }
  .tts-btns { display:flex; gap:8px; margin-left:auto; }
  .tts-btns button { background:#21262d; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 10px; font-size:0.8rem; cursor:pointer; }
  .tts-btns button:active { background:#30363d; }
  .meaning { margin-top:10px; font-size:1rem; color:var(--text); }
  .meaning .pos { color:var(--accent); font-weight:600; }
  .emoji-card { margin:14px 0; display:flex; align-items:center; justify-content:center; width:100%; height:130px; border-radius:16px; background:linear-gradient(135deg,#1f6feb,#a371f7); font-size:4.5rem; box-shadow:0 6px 18px rgba(0,0,0,0.25); }
  .story, .tip { margin-top:12px; padding:12px; border-radius:12px; background:#0d1117; border-left:4px solid var(--accent); }
  .story strong, .tip strong { color:var(--head); }
  .story { color:var(--text); }
  .tip { color:var(--sub); font-size:0.95rem; }
  .sentences { margin-top:14px; }
  .sent-title { font-size:0.9rem; color:var(--sub); margin-bottom:8px; }
  .sentence { display:flex; gap:10px; align-items:flex-start; background:#0d1117; border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; }
  .sen-text { flex:1; }
  .sen-en { color:var(--head); font-size:0.98rem; }
  .sen-cn { color:var(--sub); font-size:0.9rem; margin-top:4px; }
  .play-btn { background:#21262d; border:1px solid var(--border); border-radius:50%; width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; cursor:pointer; flex-shrink:0; margin-top:2px; }
  .play-btn:active { background:#30363d; }
  .footer { text-align:center; margin-top:24px; color:var(--sub); font-size:0.85rem; }
</style>
</head>
<body>
<header>
  <h1>雅思核心词汇</h1>
  <div class="day-tag">Day 05</div>
</header>
<div class="ctrl">
  <button class="btn-shuffle" onclick="renderWords()">🔄 重新乱序</button>
</div>
<div id="words"></div>
<div class="footer">点击 🇬🇧/🇺🇸 听单词，点击 🔊 听例句</div>
<script>
const rawWords = [
  { word:"arbitrary", ipa:"/ˈɑːrbɪtreri/", pos:"adj.", mean:"任意的，武断的；专横的", emoji:"🤷", story:"国王“啊笔吹”（arbi）就决定了你的生死，完全没有理由，这就是 arbitrary。", tip:"态度词，作者说 arbitrary decision 时通常暗示不认可。", sents:[{en:"The choice of color seems completely arbitrary.", cn:"颜色选择看起来完全随意。"},{en:"Arbitrary rules can frustrate employees and lower morale.", cn:"武断的规定会让员工沮丧、士气低落。"},{en:"The judge criticized the arbitrary nature of the fine.", cn:"法官批评罚款的武断性质。"}]},
  { word:"tangible", ipa:"/ˈtændʒəbl/", pos:"adj.", mean:"可触摸的，真实的；切实的", emoji:"✋", story:"探着摸（tan-gible）到实物，才有 tangible 的质感。", tip:"与 abstract / intangible 相反，常形容证据、好处、成果。", sents:[{en:"The policy produced tangible benefits for local families.", cn:"这项政策为当地家庭带来了切实好处。"},{en:"There is no tangible evidence to support that claim.", cn:"没有确凿证据支持那个说法。"},{en:"She needed a tangible goal to stay motivated.", cn:"她需要一个看得见的目标来保持动力。"}]},
  { word:"validate", ipa:"/ˈvælɪdeɪt/", pos:"v.", mean:"证实，确认；使生效", emoji:"✅", story:"为了让它（vali）确定日期（date），validate 就是盖章确认。", tip:"学术写作中常用 validate a hypothesis / theory。", sents:[{en:"The experiment was designed to validate the new hypothesis.", cn:"实验旨在验证新假设。"},{en:"Please validate your ticket before boarding the train.", cn:"上车前请验票。"},{en:"The results validate the need for further research.", cn:"结果证明了进一步研究的必要性。"}]},
  { word:"tentative", ipa:"/ˈtentətɪv/", pos:"adj.", mean:"试探性的，不确定的；暂时的", emoji:"🧭", story:"帐篷（tent）里的人还在试探（tative），所以 tentative。", tip:"常用于计划、结论、协议，表示非最终。", sents:[{en:"We have made a tentative arrangement for next Friday.", cn:"我们为下周五做了暂定安排。"},{en:"Her conclusion was tentative and needed more data.", cn:"她的结论只是试探性的，需要更多数据。"},{en:"He gave a tentative smile before joining the group.", cn:"他试探性笑了笑，才加入人群。"}]},
  { word:"contemporary", ipa:"/kənˈtempəreri/", pos:"adj./n.", mean:"当代的，现代的；同时代的人", emoji:"🏙️", story:"con（共同）+ tempor（时间）+ ary = 同一时代的人。", tip:"注意别和 temporary（临时的）搞混。", sents:[{en:"Contemporary art often challenges traditional ideas.", cn:"当代艺术常挑战传统观念。"},{en:"He was a contemporary of Shakespeare.", cn:"他和莎士比亚同时代。"},{en:"The novel reflects contemporary social issues.", cn:"小说反映了当代社会问题。"}]},
  { word:"discrepancy", ipa:"/dɪˈskrepənsi/", pos:"n.", mean:"差异，不一致", emoji:"⚖️", story:"dis-分开 + crep裂开 + ancy = 数据裂开了，出现 discrepancy。", tip:"数据、报告、账目之间出现不一致时常用。", sents:[{en:"There is a discrepancy between the two accounts.", cn:"两本账之间存在出入。"},{en:"The police noted a discrepancy in his statement.", cn:"警方注意到他的陈述有矛盾。"},{en:"We need to resolve the discrepancy before finalizing the report.", cn:"定稿前需解决数据差异。"}]},
  { word:"endorse", ipa:"/ɪnˈdɔːrs/", pos:"v.", mean:"赞同，支持；背书；代言", emoji:"👍", story:"in-进入 + dors背 = 在背面签名，endorse 就是支持。", tip:"商业、政治语境常见，常指名人代言或官方支持。", sents:[{en:"Several celebrities endorsed the new product.", cn:"多位名人代言了这款新品。"},{en:"The committee refused to endorse the proposal.", cn:"委员会拒绝支持该提案。"},{en:"I fully endorse your decision to study abroad.", cn:"我完全支持你出国深造的决定。"}]},
  { word:"hostile", ipa:"/ˈhɑːstaɪl/", pos:"adj.", mean:"敌对的，敌意的；不利的", emoji:"⚔️", story:"host（主人）+ ile = 主人却对你怀有敌意，hostile。", tip:"常与 to / toward 搭配，也可形容环境不利。", sents:[{en:"The local people were hostile to the new development project.", cn:"当地人敌视新开发项目。"},{en:"The environment became increasingly hostile to small businesses.", cn:"环境对小企业越来越不利。"},{en:"He received a hostile reception at the meeting.", cn:"他在会议上受到敌视。"}]},
  { word:"implement", ipa:"/ˈɪmplɪment/", pos:"v./n.", mean:"实施，执行；工具，器具", emoji:"🛠️", story:"im-向内 + ple满 + ment = 把计划填满落地，implement。", tip:"常考政策、措施、计划的实施，作名词指工具。", sents:[{en:"The government plans to implement new environmental regulations.", cn:"政府计划实施新的环保法规。"},{en:"We need better tools to implement this strategy.", cn:"我们需要更好的工具来执行策略。"},{en:"The policy was implemented in three stages.", cn:"该政策分三阶段实施。"}]},
  { word:"invoke", ipa:"/ɪnˈvoʊk/", pos:"v.", mean:"援引；祈求；引起", emoji:"📜", story:"in- + voke呼唤 = 呼唤法律或神灵，invoke。", tip:"法律、计算机、宗教语境都常用。", sents:[{en:"The lawyer decided to invoke a rarely used law.", cn:"律师决定援引一条很少使用的法律。"},{en:"His speech invoked memories of better times.", cn:"他的演讲唤起美好时光的记忆。"},{en:"Many rituals invoke the names of ancient gods.", cn:"许多仪式呼唤古神的名字。"}]},
  { word:"lenient", ipa:"/ˈliːniənt/", pos:"adj.", mean:"宽大的，宽容的", emoji:"🌿", story:"leni 联想 line 线 + ent = 把线放宽，lenient。", tip:"法律、教育、处罚语境，常作 strict 的反义。", sents:[{en:"The judge was lenient with first-time offenders.", cn:"法官对初犯宽大处理。"},{en:"Some parents believe teachers are too lenient these days.", cn:"有些家长认为老师如今太宽容。"},{en:"The company took a lenient approach to remote work.", cn:"公司对远程办公采取宽松态度。"}]},
  { word:"obsolete", ipa:"/ˌɑːbsəˈliːt/", pos:"adj.", mean:"过时的，淘汰的", emoji:"📼", story:"ob-反 + solete = 跟不上时代，solo 都被淘汰，obsolete。", tip:"科技、产品、技能过时常见。", sents:[{en:"This type of software is now practically obsolete.", cn:"这类软件现在几乎已过时。"},{en:"The old equipment became obsolete within five years.", cn:"旧设备五年内就被淘汰。"},{en:"Traditional skills may become obsolete in the digital age.", cn:"传统技能在数字时代可能过时。"}]},
  { word:"optimistic", ipa:"/ˌɑːptɪˈmɪstɪk/", pos:"adj.", mean:"乐观的", emoji:"🌞", story:"opti（最佳）+ mistic = 凡事往最佳想，optimistic。", tip:"态度词，常与 about 搭配。", sents:[{en:"She remains optimistic about the future of the project.", cn:"她对项目未来仍乐观。"},{en:"Economists are cautiously optimistic about the recovery.", cn:"经济学家对复苏谨慎乐观。"},{en:"An optimistic outlook can improve your mental health.", cn:"乐观 outlook 能改善心理健康。"}]},
  { word:"paramount", ipa:"/ˈpærəmaʊnt/", pos:"adj.", mean:"至高无上的，最重要的", emoji:"⛰️", story:"para（超越）+ mount（山）= 超越山顶，paramount。", tip:"写作中表达最重要、首要，常用 of paramount importance。", sents:[{en:"Safety is of paramount importance in this industry.", cn:"安全在这个行业至关重要。"},{en:"Customer satisfaction is paramount to our success.", cn:"客户满意对我们成功至关重要。"},{en:"The protection of data is paramount.", cn:"数据保护至关重要。"}]},
  { word:"persistent", ipa:"/pərˈsɪstənt/", pos:"adj.", mean:"持续的；坚持不懈的", emoji:"🌊", story:"per-始终 + sist站 + ent = 始终站着，persistent。", tip:"可用于雨、烟、问题等持续存在，也可形容人坚持。", sents:[{en:"Persistent rain caused severe flooding in the region.", cn:"持续降雨导致该地区严重洪灾。"},{en:"She showed persistent effort despite repeated failures.", cn:"尽管屡败，她仍坚持不懈。"},{en:"The persistent smell of smoke alarmed the residents.", cn:"持续的烟味引起居民警觉。"}]}
];

function play(url){ const a=new Audio(url); a.play().catch(()=>{}); }
function playWord(word,type){ play('https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(word)+'&type='+type); }
function playSentence(text){ play('https://fanyi.baidu.com/gettts?lan=uk&spd=4&text='+encodeURIComponent(text)); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function renderWords(){
  const list=shuffle(rawWords);
  const container=document.getElementById('words');
  container.innerHTML=list.map(w=>{
    const sents=w.sents.map((s,i)=>`<div class="sentence"><div class="sen-text"><div class="sen-en">${i+1}. ${s.en}</div><div class="sen-cn">${s.cn}</div></div><button class="play-btn" onclick="playSentence('${s.en.replace(/'/g,"\\'")}')">🔊</button></div>`).join('');
    return `<div class="card">
      <div class="word-row">
        <div>
          <div class="word">${w.word}</div>
          <div class="ipa">${w.ipa}</div>
        </div>
        <div class="tts-btns">
          <button onclick="playWord('${w.word}',1)">🇬🇧 GB</button>
          <button onclick="playWord('${w.word}',2)">🇺🇸 US</button>
        </div>
      </div>
      <div class="meaning"><span class="pos">${w.pos}</span> ${w.mean}</div>
      <div class="emoji-card">${w.emoji}</div>
      <div class="story"><strong>记忆故事</strong><br>${w.story}</div>
      <div class="tip"><strong>用法提示</strong><br>${w.tip}</div>
      <div class="sentences">
        <div class="sent-title">例句</div>
        ${sents}
      </div>
    </div>`;
  }).join('');
}
renderWords();
</script>
<style>
#liveClockBar{position:fixed;top:0;left:0;right:0;z-index:99999;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;background:linear-gradient(90deg,#0b0f17 0%,#11182a 50%,#0b0f17 100%);border-bottom:1px solid rgba(120,170,255,.4);box-shadow:0 2px 18px rgba(0,0,0,.55),0 1px 0 rgba(88,166,255,.3) inset;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#c9d1d9;font-size:13px;overflow:hidden}
#liveClockBar .lc-dot{width:8px;height:8px;border-radius:50%;background:#3fb950;box-shadow:0 0 8px #3fb950;animation:lcPulse 1.4s infinite;flex:0 0 auto}
@keyframes lcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}
#liveClockBar .lc-date{color:#8b949e;white-space:nowrap}
#liveClockBar .lc-time{font-variant-numeric:tabular-nums;font-weight:700;color:#e6edf3;letter-spacing:.5px;font-size:15px}
#liveClockBar .lc-time #lcH,#liveClockBar .lc-time #lcM{color:#58a6ff}
#liveClockBar .lc-sec{color:#ff7b72}
#liveClockBar .lc-tag{margin-left:auto;color:#d2991d;font-size:11px;white-space:nowrap}
#liveClockBar .lc-bar{position:absolute;left:0;bottom:0;height:2px;background:linear-gradient(90deg,#58a6ff,#ff7b72);width:0%}
#liveClockBar .qr-copy{margin-left:auto;color:#58a6ff;font-size:12px;border:1px solid rgba(88,166,255,.4);border-radius:20px;padding:3px 10px;cursor:pointer;white-space:nowrap}
@media(max-width:430px){#liveClockBar .lc-tag{display:none}#liveClockBar .lc-date{font-size:11px}#liveClockBar .qr-copy{display:none}}
body{padding-top:44px!important}
</style>
<div id="liveClockBar">
<span class="lc-dot"></span>
<span class="lc-date" id="lcDate">--</span>
<span class="lc-time"><span id="lcH">--</span>:<span id="lcM">--</span>:<span class="lc-sec" id="lcS">--</span></span>
<span class="lc-tag">time goes by</span>
<i class="lc-bar" id="lcBar"></i>
</div>
<script>
(function(){
  var w=['周日','周一','周二','周三','周四','周五','周六'];
  function p(n){return (n<10?'0':'')+n;}
  function tick(){
    var d=new Date();
    var dt=document.getElementById('lcDate');
    if(dt) dt.textContent=d.getFullYear()+'年'+p(d.getMonth()+1)+'月'+p(d.getDate())+'日 '+w[d.getDay()];
    var h=document.getElementById('lcH'),m=document.getElementById('lcM'),s=document.getElementById('lcS'),b=document.getElementById('lcBar');
    if(h)h.textContent=p(d.getHours());
    if(m)m.textContent=p(d.getMinutes());
    if(s)s.textContent=p(d.getSeconds());
    if(b)b.style.width=(d.getSeconds()/60*100)+'%';
  }
  tick();setInterval(tick,1000);
  window.lcZoom=function(img){ if(img&&img.src) window.open(img.src,'_blank'); };
  window.lcCopyWx=function(){
    var id="Harryalwayslucky";
    if(!id) return;
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(id).then(function(){alert('微信号已复制：'+id);}); }
    else { var t=document.createElement('textarea'); t.value=id; document.body.appendChild(t); t.select(); try{document.execCommand('copy');alert('微信号已复制：'+id);}catch(e){} document.body.removeChild(t); }
  };
})();
</script></body>
</html>
